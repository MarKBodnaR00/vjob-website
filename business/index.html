    function kv(kulcs, ertek, opts = {}) {
        const masol = opts.masol;
        const gomb = masol ? h("button", { class: "copy", type: "button" }, t().copy) : null;
        if (gomb) {
            gomb.addEventListener("click", async () => {
                let ok = false;
                try { await navigator.clipboard.writeText(ertek); ok = true; } catch (e) {
                    try {
                        const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = ertek;
                        document.body.append(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
                    } catch (e2) { ok = false; }
                }
                if (ok) { gomb.textContent = t().copied; gomb.classList.add("done"); setTimeout(() => { gomb.textContent = t().copy; gomb.classList.remove("done"); }, 1800); }
            });
        }
        return h("div", { class: "kv-row" },
            h("span", { class: "kv-k" }, kulcs),
            h("span", { class: "kv-v" + (opts.nagy ? " big" : "") }, ertek, gomb));
    }

    function viewBank() {
        const L = t();
        const b = S.bank;
        const fizetendo = b.hatralevo > 0 ? b.hatralevo : b.osszeg;
        // Az összeg részletezése (mint a díjbekérőn): csak ha a szerver adta (régi fizetéseknél hiányzik) és nincs részleges befizetés.
        const reszletes = !(b.befizetve > 0) && Number.isFinite(b.netto) && Number.isFinite(b.afa);
        const sorok = [];
        if (reszletes) {
            if (b.kedvezmenySzazalek > 0 && Number.isFinite(b.listaAr)) {
                sorok.push(kv(L.listPrice(b.fordAdozas), money(b.listaAr)), kv(L.bDiscount(b.kedvezmenySzazalek), `−${money(b.kedvezmenyOsszeg)}`));
            }
            sorok.push(kv(L.net, money(b.netto)), kv(b.fordAdozas ? L.vatReverse : L.vatLine(27), money(b.afa)));
        }
        if (b.befizetve > 0) sorok.push(kv(L.alreadyPaid, money(b.befizetve)), kv(L.remaining, money(fizetendo), { nagy: true }));
        else sorok.push(kv(L.amount, money(fizetendo), { nagy: true }));
        sorok.push(
            kv(L.beneficiary, "Infinity Gold Kft."),
            kv(L.bankName, b.bankNev),
            kv(L.account, b.bankszamlaszam, { masol: true }),
            kv(L.reference, b.kozlemeny, { masol: true }),
            kv(L.deadline, dateText(b.lejarMs)));
        return h("div", { class: "bank-wrap" },
            h("span", { class: "status-pill" }, L.waiting(daysUntil(b.lejarMs))),
            h("h1", null, L.bankTitle),
            h("p", { class: "sub" }, [b.hirdetesCim, describePurchase(b.vasarlasTipus, b.csomagKod, b.kiemelesKod)].filter(Boolean).join(" · ")),
            h("div", { class: "kv" }, sorok),
            h("p", { class: "note" }, L.refMust),
            h("p", { class: "note" }, L.afterPay),
            S.prog && S.prog.meghivo ? h("div", { class: "invite-card" },
                h("div", null, h("b", null, L.bnInviteTitle), h("span", null, L.bnInviteText(pb().kuponDb, pb().kuponSzazalek))),
                h("button", { class: "mbtn", type: "button", onclick: () => goTab("inv") }, L.btnInvite)) : null,
            h("button", { class: "btn", type: "button", onclick: () => goTab(b.from || "buy") },
                b.from === "ads" ? L.backAdsTab : b.from === "pay" ? L.backPayTab : b.from === "ov" ? L.backOvTab : L.backToAds));
    }

    function openBank(f, hirdetes) {
        S.bank = {
            hirdetesCim: [hirdetes.pozicio, hirdetes.helyszin].filter(Boolean).join(" – "),
            vasarlasTipus: f.vasarlasTipus, csomagKod: f.csomagKod, kiemelesKod: f.kiemelesKod,
            osszeg: f.osszeg, befizetve: f.befizetve || 0, hatralevo: f.hatralevo,
            netto: f.netto, afa: f.afa, listaAr: f.listaAr, fordAdozas: f.fordAdozas === true,
            kedvezmenySzazalek: f.kedvezmenySzazalek || 0, kedvezmenyOsszeg: f.kedvezmenyOsszeg || 0,
            bankNev: f.bankNev, bankszamlaszam: f.bankszamlaszam, kozlemeny: f.kozlemeny, lejarMs: f.lejarMs,
            from: S.tab
        };
        show("bank");
    }

    // ───────────────────────── Műveletek ─────────────────────────
    async function requestPayment() {
        const hirdetes = ad();
        if (!hirdetes || S.busy) return;
        const csomagKod = S.mode === "csomag" ? S.pack : null;
        const kiemelesKod = S.hl || null;
        S.busy = true; setMsg(null); render();
        try {
            // Kedvezményt csak akkor kérünk, ha az árelőnézet felkínálta és a cég nem kapcsolta ki; a szerver újra ellenőrzi és csak ekkor foglalja le.
            const pv = currentPreview();
            const kedvezmenyKer = !!(pv && pv.kedvezmeny && pv.arKedvezmennyel && S.useDiscount);
            const r = await call("createAtutalasosFizetes", { hirdetesId: hirdetes.id, csomagKod, kiemelesKod, kedvezmenyKer });
            S.bank = {
                hirdetesCim: [hirdetes.pozicio, hirdetes.helyszin].filter(Boolean).join(" – "),
                vasarlasTipus: csomagKod ? "alapcsomag" : "kiemeles", csomagKod, kiemelesKod,
                osszeg: r.osszeg, befizetve: 0, hatralevo: r.osszeg,
                netto: r.netto, afa: r.afa, listaAr: r.listaAr, fordAdozas: r.fordAdozas === true,
                kedvezmenySzazalek: r.kedvezmeny ? r.kedvezmeny.szazalek : 0, kedvezmenyOsszeg: r.kedvezmeny ? r.kedvezmeny.osszeg : 0,
                bankNev: r.bankNev, bankszamlaszam: r.bankszamlaszam, kozlemeny: r.kozlemeny, lejarMs: r.lejar || Date.now() + 10 * DAY,
                from: "buy"
            };
            S.busy = false;
            S.useDiscount = true;
            show("bank");
            refreshQuietly();
        } catch (e) {
            S.busy = false;
            setMsg("hiba", payError(e));
            render();
            const m = (e && e.message) || "";
            if (m === "PAYMENT_ALREADY_OPEN" || m === "HIGHLIGHT_NEEDS_ACTIVE_AD" || m === "DISCOUNT_NOT_AVAILABLE") refreshQuietly(true);
        }
    }

    /** A lista újratöltése a háttérben (a nézet marad). */
    async function refreshQuietly(rajzol) {
        try {
            const [adat, prog] = await Promise.all([call("listazCegHirdeteseit"), call("programAdatok").catch(() => null)]);
            S.data = adat;
            if (prog) S.prog = prog;
            S.previewKey = ""; S.preview = null; // a kedvezmények változhattak: az árelőnézetet újra kérjük
            ensureSelection();
            if (rajzol || S.view === "account") render(); else renderNav();
        } catch (e) { /* a következő megnyitáskor úgyis újratölt */ }
    }

    async function loadData() {
        show("loading");
        try {
            // A program adatai (kedvezmények, alapító hely, meghívás) kiegészítők: ha nem töltődnek be, a vásárlás és a lista így is működik.
            const [adat, prog] = await Promise.all([call("listazCegHirdeteseit"), call("programAdatok").catch(() => null)]);
            S.data = adat;
            S.prog = prog;
            S.previewKey = ""; S.preview = null;
            if (S.data.munkavallalo) { show("worker"); return; }
            ensureSelection();
            show("account");
        } catch (e) {
            if (e && e.code === "functions/unauthenticated") { await signOut(auth); return; }
            show("error");
        }
    }

    // ───────────────────────── Indítás ─────────────────────────
    document.querySelectorAll(".lang-btn").forEach((b) => b.addEventListener("click", () => {
        S.lang = b.dataset.lang;
        try { localStorage.setItem("vjob_lang", S.lang); } catch (e) { /* nem baj */ }
        render();
    }));
    async function logout() {
        try { await signOut(auth); } catch (e) { /* az onAuthStateChanged úgyis kezeli */ }
    }
    $("logout-btn").addEventListener("click", logout);
    $("theme-btn").addEventListener("click", () => setTheme(currentTheme() === "dark" ? "light" : "dark"));

    onAuthStateChanged(auth, (user) => {
        S.user = user;
        S.busy = false;
        if (!user) {
            S.data = null; S.adId = null; S.bank = null; S.tab = kezdoFul(); setMsg(null);
            S.prog = null; S.preview = null; S.previewKey = ""; S.previewBusy = false; S.fordAdozas = null; S.useDiscount = true;
            S.founderConfirm = null; S.founderErr = null; S.founderBusy = false;
            show("login");
            loadPub();
            return;
        }
        loadData();
    });

    render();
</script>

</body>
</html>
