<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>VJob Business – Céges fiók</title>
    <script>
        // Téma: alapértelmezés a sötét; a választást (ha a böngésző engedi) megjegyezzük. A festés előtt fut, hogy ne villanjon.
        (function () {
            var tema = "dark";
            try { if (localStorage.getItem("vjob_theme") === "light") tema = "light"; } catch (e) { /* nem baj */ }
            document.documentElement.setAttribute("data-theme", tema);
        })();
    </script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07060E; --tx: #e2e0f0; --h: #ffffff;
            --mut: rgba(255,255,255,0.58); --mut2: rgba(255,255,255,0.5); --mut3: rgba(255,255,255,0.66);
            --line: rgba(255,255,255,0.08); --line2: rgba(255,255,255,0.12); --line3: rgba(255,255,255,0.16);
            --surf: rgba(255,255,255,0.03); --surf2: rgba(255,255,255,0.06);
            --card: #110A20; --card2: #150C26; --card3: #0D0B1A;
            --cardb: rgba(180,80,255,0.25); --cardb2: rgba(180,80,255,0.28); --cardb3: rgba(136,0,255,0.25);
            --hd1: #0D0B1E; --hd2: #1A0A2E; --hdb: rgba(180,80,255,0.2);
            --acc: #C084FC; --price: #E879F9; --sel-bg: rgba(139,47,201,0.16); --sel-bd: #C084FC;
            --inp-bg: rgba(255,255,255,0.04); --inp-bd: rgba(255,255,255,0.14); --inp-tx: #ffffff;
            --ok: #00eda0; --ok-bg: rgba(0,200,120,0.14); --bad: #ff7a5c; --bad-bg: rgba(255,68,0,0.14);
            --warn: #ffb020; --warn-bg: rgba(255,176,32,0.14); --warn-bd: rgba(255,176,32,0.4); --warn-t: #FFD27A;
            --err-bg: rgba(255,68,85,0.1); --err-bd: rgba(255,68,85,0.35); --err-tx: #FF9AA6;
            --okb-bg: rgba(0,200,120,0.1); --okb-bd: rgba(0,200,120,0.35); --okb-tx: #6FE3B2;
            --wb-bg: rgba(255,176,32,0.09); --wb-tx: #FFD27A; --wb-b: #FFE2A6;
            --note-bg: rgba(192,132,252,0.08); --note-bd: rgba(192,132,252,0.25);
            --foot: rgba(255,255,255,0.55); --foot-b: rgba(255,255,255,0.72);
            --lang-bg: rgba(255,255,255,0.05); --lang-bd: rgba(255,255,255,0.1); --lang-t: rgba(255,255,255,0.5); --lang-th: rgba(255,255,255,0.8); --lang-hbg: rgba(255,255,255,0.07);
            --chip: rgba(255,255,255,0.06); --chip-bd: rgba(255,255,255,0.16);
            --logo1: #C084FC; --logo2: #E879F9;
            --ic-w: #ffb020; --ic-wbg: rgba(255,176,32,0.16); --ic-r: #ff7a5c; --ic-rbg: rgba(255,100,70,0.14);
            --tile-g: #1ecb92; --tile-o: #ffb020; --tile-p: #C084FC;
        }
        html[data-theme="light"] {
            color-scheme: light;
            --bg: #F5F4FA; --tx: #2A2540; --h: #161129;
            --mut: #5E5878; --mut2: #625C7B; --mut3: #4F4968;
            --line: #EEEBF6; --line2: #E4E1F0; --line3: #D9D3EC;
            --surf: #FFFFFF; --surf2: #F3F0FB;
            --card: #FFFFFF; --card2: #FFFFFF; --card3: #FFFFFF;
            --cardb: #E4E1F0; --cardb2: #DDD6F1; --cardb3: #E4E1F0;
            --hd1: #FFFFFF; --hd2: #FFFFFF; --hdb: #E4E1F0;
            --acc: #6D28D9; --price: #A21CAF; --sel-bg: rgba(139,47,201,0.09); --sel-bd: #8B2FC9;
            --inp-bg: #FFFFFF; --inp-bd: #CFC8E6; --inp-tx: #161129;
            --ok: #066B4A; --ok-bg: rgba(0,170,110,0.12); --bad: #A52F14; --bad-bg: rgba(220,70,30,0.1);
            --warn: #8F5400; --warn-bg: rgba(230,150,0,0.14); --warn-bd: #F0C27A; --warn-t: #8A5A00;
            --err-bg: #FDECEC; --err-bd: #F3B4B4; --err-tx: #B42318;
            --okb-bg: #E8F8F0; --okb-bd: #A9E3C8; --okb-tx: #0A7A52;
            --wb-bg: #FFF6E5; --wb-tx: #8A5A00; --wb-b: #6B4500;
            --note-bg: #F3EEFD; --note-bd: #DDD0F7;
            --foot: #6F6988; --foot-b: #55506E;
            --lang-bg: #F3F0FB; --lang-bd: #E4E1F0; --lang-t: #6B6584; --lang-th: #161129; --lang-hbg: #E9E4F7;
            --chip: #F3F0FB; --chip-bd: #D9D3EC;
            --logo1: #7C2FC9; --logo2: #C026D3;
            --ic-w: #8F5400; --ic-wbg: #FFF1D6; --ic-r: #A52F14; --ic-rbg: #FDE8E3;
            --tile-g: #0fa578; --tile-o: #C77700; --tile-p: #6D28D9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--tx);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: var(--acc); }

        .header {
            background: linear-gradient(135deg, var(--hd1) 0%, var(--hd2) 100%);
            border-bottom: 1px solid var(--hdb);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header-inner {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #8B2FC9, #D946EF);
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; color: white;
            box-shadow: 0 0 20px rgba(180, 80, 255, 0.4);
        }
        html[data-theme="light"] .logo-icon { box-shadow: 0 2px 10px rgba(139, 47, 201, 0.25); }
        .logo-text {
            font-size: 21px; font-weight: 800;
            background: linear-gradient(135deg, var(--logo1), var(--logo2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .biz {
            font-size: 11px; font-weight: 800; letter-spacing: 1.6px; color: var(--acc);
            border: 1px solid var(--acc); padding: 3px 9px; border-radius: 6px;
        }
        .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .tools { display: flex; align-items: center; gap: 8px; }
        .who { font-size: 13px; color: var(--mut3); display: flex; align-items: center; gap: 10px; }
        .who.acc { padding: 4px 14px 4px 4px; border: 1px solid var(--line3); border-radius: 30px; background: var(--chip); }
        .who-name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; color: var(--h); }
        .av {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(192,132,252,0.18); color: var(--acc); font-weight: 800; font-size: 12px;
            border: 2px solid rgba(192,132,252,0.55);
        }
        .av.has-img { background: #fff; }
        .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .av.big-av { width: 68px; height: 68px; border-radius: 16px; font-size: 24px; }
        .link-btn {
            background: none; border: none; color: var(--acc); cursor: pointer;
            font: inherit; font-size: 13px; text-decoration: underline; padding: 4px 0;
        }
        .theme-btn {
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            background: var(--lang-bg); border: 1px solid var(--lang-bd); color: var(--lang-t);
        }
        .theme-btn:hover { color: var(--lang-th); background: var(--lang-hbg); }
        .theme-btn svg { width: 18px; height: 18px; }
        .theme-btn .i-moon { display: none; }
        html[data-theme="light"] .theme-btn .i-sun { display: none; }
        html[data-theme="light"] .theme-btn .i-moon { display: block; }
        .lang-switcher {
            display: flex; gap: 4px;
            background: var(--lang-bg);
            border: 1px solid var(--lang-bd);
            border-radius: 10px; padding: 3px;
        }
        .lang-btn {
            padding: 6px 12px; border: none; border-radius: 7px; background: transparent;
            color: var(--lang-t); font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #8B2FC9, #D946EF); color: white;
            box-shadow: 0 2px 10px rgba(180, 80, 255, 0.4);
        }
        .lang-btn:hover:not(.active) { color: var(--lang-th); background: var(--lang-hbg); }

        main { flex: 1; width: 100%; max-width: 980px; margin: 0 auto; padding: 36px 24px 60px; }

        h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: var(--h); }
        .sub { font-size: 14px; color: var(--mut); line-height: 1.55; margin-bottom: 22px; }

        .center-card {
            max-width: 430px; margin: 24px auto 0;
            background: var(--card3); border: 1px solid var(--cardb3);
            border-radius: 20px; padding: 30px 28px;
        }
        .center-card h1 { font-size: 22px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--mut2); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%; background: var(--inp-bg); border: 1px solid var(--inp-bd);
            border-radius: 10px; padding: 13px 14px; color: var(--inp-tx); font-size: 16px; font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: rgba(170, 68, 255, 0.7); }

        .btn {
            width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #8800FF, #DD00BB); color: #fff;
            font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.92; }
        .btn.secondary {
            background: var(--surf2); border: 1px solid var(--chip-bd); color: var(--tx);
        }
        .row-links { margin-top: 16px; text-align: center; }

        .error-box {
            background: var(--err-bg); border: 1px solid var(--err-bd); border-radius: 10px;
            padding: 12px 14px; color: var(--err-tx); font-size: 13.5px; margin-top: 16px; line-height: 1.5;
        }
        .ok-box {
            background: var(--okb-bg); border: 1px solid var(--okb-bd); border-radius: 10px;
            padding: 12px 14px; color: var(--okb-tx); font-size: 13.5px; margin-top: 16px; line-height: 1.5;
        }
        .warn-box {
            background: var(--wb-bg); border: 1px solid var(--warn-bd); border-radius: 12px;
            padding: 14px 16px; color: var(--wb-tx); font-size: 13.5px; line-height: 1.55; margin-bottom: 18px;
        }
        .warn-box b { color: var(--wb-b); }

        .spinner {
            width: 38px; height: 38px; border: 3px solid rgba(170, 68, 255, 0.2); border-top-color: #AA44FF;
            border-radius: 50%; margin: 60px auto 16px; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .center-text { text-align: center; color: var(--mut); font-size: 14px; line-height: 1.6; }
        .center-text .btn { max-width: 260px; margin-left: auto; margin-right: auto; display: block; }

        /* ── Vásárlás ── */
        .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
        .step { font-size: 11.5px; font-weight: 800; letter-spacing: 1.3px; color: var(--acc); text-transform: uppercase; margin: 22px 0 10px; }
        .step.first { margin-top: 4px; }
        .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }

        .opt {
            display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
            border: 1px solid var(--line2); background: var(--surf); color: inherit;
            border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font: inherit; font-size: 14px; cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .opt:hover { border-color: rgba(180,80,255,0.4); }
        .opt.sel { border-color: var(--sel-bd); background: var(--sel-bg); }
        .rad { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--mut2); flex-shrink: 0; }
        .sel .rad { border-color: var(--price); background: radial-gradient(var(--price) 45%, transparent 50%); }
        .opt-main { flex: 1; min-width: 0; }
        .opt-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .badge { font-size: 12px; padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
        .b-active { color: var(--ok); background: var(--ok-bg); }
        .b-inactive { color: var(--bad); background: var(--bad-bg); }
        .b-pending { color: var(--warn); background: var(--warn-bg); }

        .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .pkg {
            border: 1px solid var(--line2); background: var(--surf); color: inherit;
            border-radius: 12px; padding: 14px 8px; text-align: center; font: inherit; cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .pkg:hover { border-color: rgba(180,80,255,0.4); }
        .pkg.sel { border-color: var(--sel-bd); background: var(--sel-bg); }
        .pkg .n { font-weight: 800; font-size: 14px; }
        .pkg .d { font-size: 12px; color: var(--mut2); margin: 3px 0 7px; }
        .pkg .pr { font-weight: 800; font-size: 15px; color: var(--price); }

        .modes { display: flex; gap: 8px; margin: 18px 0 0; flex-wrap: wrap; }
        .mode {
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--line3); background: transparent;
            color: var(--mut3); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .mode.sel { background: rgba(139,47,201,0.25); border-color: var(--sel-bd); color: var(--h); }

        .open-box {
            border: 1px solid var(--warn-bd); background: var(--wb-bg); border-radius: 12px;
            padding: 12px 14px; margin: 10px 0; font-size: 13.5px;
        }
        .open-box .t { font-weight: 700; color: var(--wb-tx); margin-bottom: 4px; }
        .open-box .m { color: var(--mut3); line-height: 1.5; }
        .open-box .btn { margin-top: 10px; padding: 10px; font-size: 13.5px; }

        .side { position: sticky; top: 92px; }
        .sum { border: 1px solid var(--cardb2); background: var(--card2); border-radius: 16px; padding: 20px; }
        .sum h3 { font-size: 15px; margin-bottom: 14px; color: var(--h); }
        .sum-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--tx); margin-bottom: 9px; }
        .sum-row span:last-child { white-space: nowrap; }
        .sum-ad { font-weight: 600; color: var(--h); overflow-wrap: anywhere; }
        .tot { border-top: 1px solid var(--line3); margin-top: 12px; padding-top: 14px; display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; color: var(--h); }
        .fine { font-size: 11.5px; color: var(--mut2); line-height: 1.55; margin-top: 14px; }
        .note { font-size: 12.5px; color: var(--mut3); line-height: 1.5; margin-top: 10px; }

        /* ── Átutalási adatok ── */
        .bank-wrap { max-width: 640px; margin: 0 auto; }
        .status-pill {
            display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--warn); background: var(--warn-bg);
            border: 1px solid var(--warn-bd); padding: 5px 12px; border-radius: 20px; margin-bottom: 14px;
        }
        .kv { border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; margin-top: 16px; background: var(--surf); }
        .kv-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; font-size: 14.5px; border-bottom: 1px solid var(--line); }
        .kv-row:last-child { border-bottom: none; }
        .kv-k { color: var(--mut2); flex-shrink: 0; }
        .kv-v { font-weight: 700; text-align: right; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; justify-content: flex-end; color: var(--h); }
        .kv-v.big { font-size: 20px; color: var(--price); }
        .copy {
            border: 1px solid var(--chip-bd); background: var(--surf2); color: var(--tx);
            border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
        }
        .copy:hover { border-color: rgba(180,80,255,0.5); }
        .copy.done { color: var(--okb-tx); border-color: var(--okb-bd); }
        .bank-wrap .btn { max-width: 320px; }

        /* ── Fiók: fülek ── */
        .nav { border-bottom: 1px solid var(--line); }
        .nav-inner { position: relative; max-width: 980px; margin: 0 auto; padding: 0 8px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .nav-inner::-webkit-scrollbar { display: none; }
        .tab {
            display: flex; align-items: center; gap: 7px; padding: 15px 16px; background: none; border: none;
            border-bottom: 2px solid transparent; color: var(--mut2); font: inherit; font-size: 14px; font-weight: 600;
            cursor: pointer; white-space: nowrap;
        }
        .tab:hover { color: var(--h); }
        .tab.active { color: var(--h); border-bottom-color: #D946EF; }
        .tab-badge { background: var(--warn-bg); color: var(--warn); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }

        /* ── Fiók: 3 lépéses sáv és bizalmi sor ── */
        .flow { display: flex; border: 1px solid var(--cardb2); background: var(--card); border-radius: 16px; overflow: hidden; margin: 0 0 26px; }
        .flow-st { flex: 1; padding: 16px 18px; display: flex; gap: 13px; align-items: flex-start; }
        .flow-st + .flow-st { border-left: 1px solid var(--line); }
        .flow-num {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #8B2FC9, #D946EF); color: #fff; font-weight: 800; font-size: 14px;
        }
        .flow-st.last .flow-num { background: linear-gradient(135deg, #0DAA70, #00EDA0); color: #04210F; }
        .flow-st b { display: block; color: var(--h); font-size: 14px; margin-bottom: 3px; }
        .flow-st .d { font-size: 12.5px; color: var(--mut); line-height: 1.45; }
        .trust { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .tr { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; color: var(--mut3); line-height: 1.4; }
        .ck {
            width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
            background: var(--ok-bg); color: var(--ok); font-size: 10px; font-weight: 900;
        }
        .empty-box { border: 1px dashed var(--line3); border-radius: 14px; padding: 26px 22px; text-align: center; color: var(--mut); font-size: 14px; line-height: 1.6; }
        .empty-box b { display: block; color: var(--h); font-size: 16px; margin-bottom: 6px; }

        /* ── Fiók: áttekintés ── */
        .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 26px; }
        .tile {
            position: relative; display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
            border: 1px solid var(--cardb); background: var(--card2); border-radius: 16px; padding: 18px 18px 16px; min-width: 0;
            transition: border-color 0.15s, transform 0.15s;
        }
        .tile::after { content: "→"; position: absolute; top: 15px; right: 16px; font-size: 15px; color: var(--mut2); transition: color 0.15s, transform 0.15s; }
        .tile:hover { border-color: var(--sel-bd); }
        .tile:hover::after { color: var(--acc); transform: translateX(2px); }
        .tile:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
        .tk { font-size: 12px; color: var(--mut); margin-bottom: 8px; font-weight: 600; padding-right: 22px; }
        .tv { font-size: 30px; font-weight: 800; color: var(--h); line-height: 1; overflow-wrap: anywhere; }
        .tv.g { color: var(--tile-g); } .tv.o { color: var(--tile-o); } .tv.p { color: var(--tile-p); }
        .tv.sm { font-size: 24px; }
        .ts { font-size: 12.5px; color: var(--mut); margin-top: 8px; line-height: 1.4; }
        .sec { font-size: 11.5px; font-weight: 800; letter-spacing: 1.3px; color: var(--acc); text-transform: uppercase; margin: 0 0 10px; }
        .lrow-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
        .ic { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; }
        .ic.w { background: var(--ic-wbg); color: var(--ic-w); }

    function startLang() {
        const q = new URLSearchParams(location.search).get("lang");
        if (LANGS.includes(q)) return q;
        try {
            const mentett = localStorage.getItem("vjob_lang");
            if (LANGS.includes(mentett)) return mentett;
        } catch (e) { /* a böngésző nem engedi a tárolást: nem baj */ }
        const bongeszo = (navigator.language || "").slice(0, 2).toLowerCase();
        return LANGS.includes(bongeszo) ? bongeszo : "hu";
    }

    const $ = (id) => document.getElementById(id);

    /** Elemet épít; a szöveg MINDIG szövegcsomópontként kerül be (a felhasználói adat nem értelmeződik HTML-ként). */
    function h(tag, props, ...kids) {
        const e = document.createElement(tag);
        if (props) {
            for (const [k, v] of Object.entries(props)) {
                if (v === false || v === null || v === undefined) continue;
                if (k === "class") e.className = v;
                else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
                else e.setAttribute(k, v === true ? "" : v);
            }
        }
        for (const kid of kids.flat()) {
            if (kid === null || kid === undefined || kid === false) continue;
            e.append(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
        }
        return e;
    }

    // Ezreselválasztó minden 4 jegyű számnál is (az Intl a magyarnál a 4 jegyűt nem tagolja: "3000"), mint a csomagok oldalán: "3 000 Ft".
    const THOUSANDS = { hu: "\u00a0", en: ",", de: "." };
    function money(n) {
        const szam = String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, THOUSANDS[S.lang]);
        return `${szam}\u00a0${CURRENCY[S.lang]}`;
    }

    function durationText(nap) {
        return nap === 1 ? t().hoursLabel : `${nap} ${t().unitDays(nap)}`;
    }

    function packName(kod) {
        return t().packNames[kod] || kod;
    }

    function dateText(ms) {
        return new Date(ms).toLocaleDateString(LOCALE[S.lang], { year: "numeric", month: "long", day: "numeric" });
    }

    function daysUntil(ms) {
        return Math.max(1, Math.ceil((ms - Date.now()) / DAY));
    }

    const ar = (lista, kod) => (lista || []).find((x) => x.kod === kod) || null;

    function ad() {
        return (S.data && S.data.hirdetesek.find((x) => x.id === S.adId)) || null;
    }

    /** Mit lehet venni a hirdetéshez (ugyanazok a szabályok, mint az appban és a szerveren). */
    function adInfo(x) {
        const now = Date.now();
        const nyitottak = x.nyitottFizetesek || [];
        const vanNyitott = nyitottak.length > 0; // egy hirdetésre egyszerre egy nyitott fizetés lehet (csomag vagy kiemelés)
        const hatralevoNap = x.lejaratMs > now ? Math.ceil((x.lejaratMs - now) / DAY) : 0;
        return {
            nyitottak,
            hatralevoNap,
            csomagElerheto: !vanNyitott,
            kiemelesElerheto: x.aktiv === true && !vanNyitott
        };
    }

    function ensureSelection() {
        const d = S.data;
        if (!d || d.hirdetesek.length === 0) return;
        if (!ad()) {
            const kert = S.eloValasztottHirdetes && d.hirdetesek.find((x) => x.id === S.eloValasztottHirdetes);
            const fizetesreSzorulo = d.hirdetesek.find((x) => !(x.aktiv && x.lejaratMs > Date.now()));
            S.adId = (kert || fizetesreSzorulo || d.hirdetesek[0]).id;
            S.eloValasztottHirdetes = null;
        }
        const info = adInfo(ad());
        if (S.mode === "csomag" && !info.csomagElerheto) S.mode = "kiemeles";
        if (S.mode === "kiemeles" && !info.kiemelesElerheto && info.csomagElerheto) S.mode = "csomag";
        if (!ar(d.arak.csomagok, S.pack)) {
            S.pack = (ar(d.arak.csomagok, "kozepes") || d.arak.csomagok[0] || {}).kod || null;
        }
        if (S.hl && !ar(d.arak.kiemelesek, S.hl)) S.hl = "";
        if (S.mode === "kiemeles" && !S.hl) S.hl = (d.arak.kiemelesek[0] || {}).kod || "";
    }

    const TABS = ["ov", "buy", "ads", "pay", "inv", "co"];
    const TAB_LABEL = { ov: "tabOv", buy: "tabBuy", ads: "tabAds", pay: "tabPay", inv: "tabInv", co: "tabCo" };
    const SOON_DAYS = 3; // ennyi napon belül lejáró hirdetést "hamarosan lejár"-nak jelzünk

    /** Hány nyitott (még kifizetésre váró, le nem járt) fizetése van a cégnek. */
    function openPaymentCount() {
        return S.data ? S.data.hirdetesek.reduce((n, x) => n + (x.nyitottFizetesek || []).length, 0) : 0;
    }

    /** A közlemény alapján megkeresi a nyitott fizetést és a hirdetést, amelyikhez tartozik. */
    function findOpenPayment(kozlemeny) {
        for (const x of S.data.hirdetesek) {
            const f = (x.nyitottFizetesek || []).find((p) => p.kozlemeny === kozlemeny);
            if (f) return { f, hirdetes: x };
        }
        return null;
    }

    function adTitle(x) {
        return [x.pozicio || "—", x.helyszin ? ` – ${x.helyszin}` : ""].join("");
    }

    /** active | paused (szüneteltetett, de van még ideje) | expired | inactive (még nem fizetett) */
    function adState(x, now) {
        if (x.aktiv && x.lejaratMs > now) return "active";
        if (x.lejaratMs > now) return "paused";
        if (x.lejaratMs > 0) return "expired";
        return "inactive";
    }

    function initials() {
        const nev = (S.data && S.data.cegNev) || "";
        const szavak = nev.split(/\s+/).filter((w) => /\p{L}/u.test(w));
        let betuk = szavak.slice(0, 2).map((w) => Array.from(w.replace(/^[^\p{L}]+/u, ""))[0] || "").join("");
        if (!betuk) betuk = Array.from(((S.user && S.user.email) || "").trim())[0] || "V";
        return betuk.toUpperCase();
    }

    /** Kerek (vagy nagy lekerekített) jelvény: a cég logója, és ha nincs vagy nem tölt be, a cégnév kezdőbetűi. */
    function avatar(extra) {
        const box = h("span", { class: "av" + (extra ? ` ${extra}` : ""), "aria-hidden": "true" }, initials());
        const logo = S.data && typeof S.data.logoUrl === "string" && S.data.logoUrl.startsWith("https://") ? S.data.logoUrl : "";
        if (logo) {
            const img = h("img", { src: logo, alt: "", referrerpolicy: "no-referrer", decoding: "async" });
            img.addEventListener("load", () => { box.classList.add("has-img"); box.replaceChildren(img); });
        }
        return box;
    }

    function goTab(k) {
        S.tab = k;
        setMsg(null);
        show("account");
    }

    /** A Hirdetéseim fülről a vásárláshoz ugrik, a hirdetés és a mód előválasztásával. */
    function goBuy(hirdetes, mod) {
        S.adId = hirdetes.id;
        S.mode = mod;
        S.hl = "";
        setMsg(null);
        ensureSelection();
        S.tab = "buy";
        show("account");
    }

    function setMsg(tipus, szoveg) {
        S.msg = szoveg ? { tipus, szoveg } : null;
    }

    function payError(e) {
        const m = (e && e.message) || "";
        const code = (e && e.code) || "";
        const L = t();
        const map = {
            BILLING_DETAILS_MISSING: L.pBilling,
            COMPANY_NOT_VERIFIED: L.pNotVerified,
            HIGHLIGHT_NEEDS_ACTIVE_AD: L.pNeedsActive,
            PAYMENT_ALREADY_OPEN: L.pAlreadyOpen,
            TOO_MANY_OPEN_PAYMENTS: L.pTooMany,
            TEMPORARY_ERROR_TRY_AGAIN: L.pTemp,
            PAYMENT_START_FAILED: L.pFailed,
            DISCOUNT_NOT_AVAILABLE: L.pDiscGone,
            FOUNDER_ALREADY_USED: L.pFounderUsed,
            FOUNDER_SLOTS_FULL: L.pFounderFull,
            FOUNDER_AD_NOT_ELIGIBLE: L.pFounderAd,
            FOUNDER_COMPANY_ONLY: L.pFounderCo,
            FOUNDER_PROGRAM_CLOSED: L.pFounderClosed,
            TOO_MANY_REQUESTS: L.pTooFast
        };
        if (map[m]) return map[m];
        if (code === "functions/unauthenticated") return L.pSession;
        if (code === "functions/not-found") return L.pNotFound;
        if (code === "functions/invalid-argument") return L.pInvalid;
        if (code === "functions/deadline-exceeded" || code === "functions/unavailable") return L.pTimeout;
        if (code === "functions/resource-exhausted") return L.pTooFast;
        return L.pFailed;
    }

    function pdfError(e) {
        const m = (e && e.message) || "";
        const code = (e && e.code) || "";
        const L = t();
        if (m === "TOO_MANY_DOWNLOADS" || code === "functions/resource-exhausted") return L.pdfTooMany;
        if (m === "DOCUMENT_NOT_AVAILABLE" || code === "functions/not-found") return L.pdfNotAvailable;
        if (code === "functions/unauthenticated") return L.pSession;
        return L.pdfUnavailable;
    }

    /** A szervertől kapott base64 PDF mentése a böngészőben (a fájlnevet még egyszer megtisztítjuk). */
    function savePdf(fajlnev, base64) {
        const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
        const nev = String(fajlnev || "").replace(/[^A-Za-z0-9._-]+/g, "_").replace(/^[._]+/, "").slice(0, 80) || "dokumentum.pdf";
        const a = h("a", { href: url, download: nev, style: "display:none" });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
    }

    async function downloadPdf(kozlemeny, tipus) {
        if (S.pdfBusy) return; // egyszerre egy letöltés
        S.pdfBusy = `${kozlemeny}|${tipus}`;
        setMsg(null);
        render();
        try {
            const r = await call("letoltCegDokumentumot", { kozlemeny, tipus });
            savePdf(r && r.fajlnev, r && r.pdfBase64);
        } catch (e) {
            if (e && e.code === "functions/unauthenticated") { S.pdfBusy = null; await signOut(auth); return; }
            setMsg("hiba", pdfError(e));
        }
        S.pdfBusy = null;
        if (S.view === "account" && S.tab === "pay") render();
    }

    // ───────────────────────── Program: kedvezmények, alapító program, meghívás ─────────────────────────
    // A számokat és szabályokat a szerver adja (programAdatok, arElonezet); itt csak megjelenítés van. A PROG_ALAP csak tartalék,
    // amíg a szerver válasza nem érkezett meg.
    const PROG_ALAP = { alapitoHelyek: 30, ingyenesNap: 30, udvozloSzazalek: 15, udvozloNap: 30, kuponDb: 2, kuponSzazalek: 15, kuponHonap: 3 };

    function pb() {
        return { ...PROG_ALAP, ...((S.prog && S.prog.beallitasok) || {}) };
    }

    /** A meghívó linkből (?ref=KOD) érkező kód: csak betű, szám és kötőjel, rövidítve; a weboldal csak megjeleníti. */
    function refKodBeolvas() {
        const nyers = new URLSearchParams(location.search).get("ref") || "";
        const kod = nyers.toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 24);
        return kod.length >= 4 ? kod : "";
    }

    /** Uniós, fordított adózású cég-e (tipp az ár-kártyákhoz az árelőnézet megérkezéséig; a végleges választ a szerver adja). */
    function reverseHint() {
        const c = (S.data && S.data.cegAdatok) || {};
        return !!c.kozossegiAdoszam && !!c.orszag && c.orszag !== "Magyarország";
    }
    function isReverse() { return S.fordAdozas === null ? reverseHint() : S.fordAdozas; }
    /** Az uniós cég ugyanannyi NETTÓT fizet, mint a magyar (a szerver is így számol: bruttó / 1,27, kerekítve). */
    const netOf = (bruttoHu) => Math.round(bruttoHu / 1.27);
    const listShown = (bruttoHu) => (isReverse() ? netOf(bruttoHu) : bruttoHu);

    /** Az alapító program ingyenes aktiválására jogosult-e ez a hirdetés (még sosem volt aktív, nincs nyitott fizetése). */
    function founderEligibleAd(x) {
        const al = S.prog && S.prog.alapito;
        return !!al && al.jogosult === true && al.aktivalva !== true && !x.aktiv && !(x.lejaratMs > 0) && adInfo(x).nyitottak.length === 0;
    }

    function couponCount() {
        const now = Date.now();
        return S.prog && !S.prog.munkavallalo ? (S.prog.kuponok || []).filter((k) => k.allapot === "elerheto" && k.lejarMs > now).length : 0;
    }

    // ── Árelőnézet (a szerver számolja: nettó / ÁFA / összesen és a felhasználható kedvezmény) ──
    /** A kiválasztott vásárlás paraméterei (az árelőnézet és a fizetés kérésének közös alapja); null, ha nincs mit venni. */
    function purchaseParams() {
        const x = ad();
        if (!x) return null;
        const info = adInfo(x);
        if (S.mode === "csomag" ? !info.csomagElerheto : !info.kiemelesElerheto) return null;
        const csomagKod = S.mode === "csomag" ? S.pack : null;
        const kiemelesKod = S.hl || null;
        if (!csomagKod && !kiemelesKod) return null;
        return { hirdetesId: x.id, csomagKod, kiemelesKod };
    }

    const previewKeyOf = (p) => (p ? `${p.hirdetesId}|${p.csomagKod || ""}|${p.kiemelesKod || ""}` : "");

    /** A kiválasztott vásárláshoz tartozó, megérkezett árelőnézet (vagy null). */
    function currentPreview() {
        const p = purchaseParams();
        return p && S.previewKey === previewKeyOf(p) && S.preview ? S.preview : null;
    }

    /** Elindítja az árelőnézetet, ha a kiválasztás megváltozott; a válasz megérkezésekor újrarajzol. A régi válasz nem írja felül az újat. */
    async function ensurePreview(force) {
        const p = purchaseParams();
        const key = previewKeyOf(p);
        if (!p) { S.preview = null; S.previewKey = ""; S.previewBusy = false; S.previewHiba = false; return; }
        if (!force && S.previewKey === key) return;
        S.previewKey = key; S.preview = null; S.previewBusy = true; S.previewHiba = false;
        try {
            const r = await call("arElonezet", p);
            if (S.previewKey !== key) return;
            S.preview = r;
            if (r && typeof r.fordAdozas === "boolean") S.fordAdozas = r.fordAdozas;
        } catch (e) {
            if (S.previewKey !== key) return;
            if (e && e.code === "functions/unauthenticated") { await signOut(auth); return; }
            S.previewHiba = true;
        }
        S.previewBusy = false;
        if (S.view === "account" && S.tab === "buy") render();
    }

    // ── Alapító program: ingyenes aktiválás ──
    function founderCard(x, info) {
        const L = t();
        const al = S.prog && S.prog.alapito;
        if (!al || !founderEligibleAd(x)) return null;
        const b = pb();
        const megerosit = S.founderConfirm === x.id;
        return h("div", { class: "founder" },
            h("div", { class: "sec" }, L.founderLeft(al.szabad, al.osszes)),
            h("h3", null, L.founderTitle(b.ingyenesNap)),
            h("p", null, megerosit ? L.founderConfirm(b.ingyenesNap) : L.founderText(b.ingyenesNap)),
            S.founderErr ? h("div", { class: "error-box", role: "alert" }, S.founderErr) : null,
            megerosit
                ? h("div", { class: "founder-actions" },
                    h("button", { class: "btn", type: "button", disabled: S.founderBusy, onclick: () => activateFounder(x) }, S.founderBusy ? L.founderBusy : L.founderConfirmBtn),
                    h("button", { class: "btn secondary", type: "button", disabled: S.founderBusy, onclick: () => { S.founderConfirm = null; render(); } }, L.founderCancel))
                : h("button", { class: "btn", type: "button", onclick: () => { S.founderErr = null; S.founderConfirm = x.id; render(); } }, L.founderBtn));
    }

    async function activateFounder(x) {
        if (S.founderBusy) return;
        S.founderBusy = true; S.founderErr = null; render();
        try {
            const r = await call("alapitoAktival", { hirdetesId: x.id });
            S.founderBusy = false; S.founderConfirm = null;
            await refreshQuietly();
            S.tab = "ov";
            setMsg("ok", t().founderDone(dateText(r.lejaratMs)));
            show("account");
        } catch (e) {
            S.founderBusy = false; S.founderConfirm = null;
            if (e && e.code === "functions/unauthenticated") { await signOut(auth); return; }
            S.founderErr = payError(e);
            const m = (e && e.message) || "";
            if (m.startsWith("FOUNDER_")) await refreshQuietly();
            render();
        }
    }

    // ── Áttekintés: visszaszámláló sávok ──
    function programBanners() {
        const L = t();
        const pr = S.prog;
        if (!pr || pr.munkavallalo) return null;
        const now = Date.now();
        const b = pb();
        const d = S.data;
        const lista = [];
        const gomb = (felirat, fn, elsodleges) => h("button", { class: "mbtn" + (elsodleges ? " primary" : ""), type: "button", onclick: fn }, felirat);
        const sav = (arany) => h("div", { class: "bar", role: "presentation" }, h("i", { style: `width:${Math.round(Math.min(1, Math.max(0, arany)) * 100)}%` }));
        const banner = (osztaly, jel, cim, meta, savEl, gombok) => h("div", { class: `banner ${osztaly}` },
            h("div", { class: "bi", "aria-hidden": "true" }, jel),
            h("div", { class: "bb" },
                h("div", { class: "bt" }, cim),
                meta ? h("div", { class: "bm" }, meta) : null,
                savEl || null,
                gombok && gombok.length ? h("div", { class: "bx" }, gombok) : null));

        const al = pr.alapito;
        const u = pr.udvozlo;
        const szabadIdoBanner = !!al && al.aktivalva === true && al.ingyenesVegeMs > now;
        if (szabadIdoBanner) {
            const nap = daysUntil(al.ingyenesVegeMs);
            lista.push(banner("ok", "★", L.bnFreeTitle(nap),
                L.bnFreeMeta(dateText(al.ingyenesVegeMs), b.udvozloSzazalek, u && u.lejarMs > now ? dateText(u.lejarMs) : ""),
                sav((al.ingyenesVegeMs - now) / (b.ingyenesNap * DAY)),
                [gomb(L.btnShop, () => goTab("buy"))]));
        }

        // Az üdvözlő kedvezmény külön sávja csak akkor kell, ha az ingyenes időszak sávja nem említi már.
        if (!szabadIdoBanner && u && u.elerheto === true && u.lejarMs > now) {
            const nap = daysUntil(u.lejarMs);
            lista.push(banner(nap <= 7 ? "warn" : "pro", "%", L.bnWelcomeTitle(u.szazalek, nap), L.bnWelcomeMeta(dateText(u.lejarMs)),
                sav((u.lejarMs - now) / (b.udvozloNap * DAY)),
                [gomb(L.btnShop, () => goTab("buy"), true)]));
        }

        const kuponok = (pr.kuponok || []).filter((k) => k.allapot === "elerheto" && k.lejarMs > now).sort((x, y) => x.lejarMs - y.lejarMs);
        if (kuponok.length) {
            const elso = kuponok[0];
            const nap = daysUntil(elso.lejarMs);
            const surgos = nap <= 14;
            lista.push(banner(surgos ? "warn" : "pro", "%", L.bnCouponTitle(kuponok.length, elso.szazalek),
                L.bnCouponMeta(dateText(elso.lejarMs), nap) + (surgos ? ` ${L.bnCouponSoon(b.kuponDb)}` : ""),
                sav((elso.lejarMs - now) / (b.kuponHonap * 30.4 * DAY)),
                [gomb(L.btnShop, () => goTab("buy"), true), gomb(L.btnInvite, () => goTab("inv"))]));
        }

        if (al && al.jogosult === true && al.aktivalva !== true) {
            const elsoHirdetes = d.hirdetesek.find((x) => founderEligibleAd(x));
            lista.push(banner("ok", "★", L.bnFounderTitle(b.ingyenesNap),
                `${L.founderLeft(al.szabad, al.osszes)}. ${elsoHirdetes ? L.bnFounderTextAd : L.bnFounderTextNoAd}`, null,
                elsoHirdetes ? [gomb(L.btnActivateFree, () => goBuy(elsoHirdetes, "csomag"), true)] : null));
        }

        if (!kuponok.length && pr.meghivo) {
            lista.push(banner("pro", "✉", L.bnInviteTitle, L.bnInviteText(b.kuponDb, b.kuponSzazalek), null, [gomb(L.btnInvite, () => goTab("inv"))]));
        }
        return lista.length ? h("div", { class: "banners" }, lista) : null;
    }

    // ── Meghívás fül ──
    function tabInv() {
        const L = t();
        const pr = S.prog;
        const b = pb();
        if (!pr || !pr.meghivo) {
            return h("div", null, topline(L.invTitle, L.invSub(b.kuponDb, b.kuponSzazalek)), h("div", { class: "error-box", role: "alert" }, L.invLoadErr));
        }
        const now = Date.now();
        const kuponok = pr.kuponok || [];
        const meghivottak = pr.meghivottak || [];
        const fizetett = meghivottak.filter((m) => m.allapot === "fizetett").length;
        const elerheto = kuponok.filter((k) => k.allapot === "elerheto" && k.lejarMs > now).length;
        const statCsempe = (kulcs, ertek, szin) => h("div", { class: "tile static" }, h("div", { class: "tk" }, kulcs), h("div", { class: "tv" + (szin ? ` ${szin}` : "") }, String(ertek)));

        const lepesek = L.invSteps(b.kuponDb, b.kuponSzazalek, b.kuponHonap);
        const folyamat = h("div", { class: "flow inv-steps" }, lepesek.map((l, i) => h("div", { class: "flow-st" + (i === lepesek.length - 1 ? " last" : "") },
            h("div", { class: "flow-num" }, String(i + 1)),
            h("div", null, h("b", null, l[0]), h("div", { class: "d" }, l[1])))));

        const kuponSorok = kuponok.map((k) => h("div", { class: "lrow" },
            h("div", { class: "lrow-main" },
                h("div", { class: "lrow-v" }, L.invCouponName(k.szazalek)),
                h("div", { class: "lrow-meta" }, L.discExpires(dateText(k.lejarMs)))),
            h("div", { class: "lrow-side" },
                h("span", { class: "badge " + (k.allapot === "elerheto" ? "b-active" : k.allapot === "foglalt" ? "b-pending" : "b-expired") }, L.invCouponState[k.allapot] || k.allapot))));

        // A szerver a meghívott cég nevét nem adja ki (adatminimalizálás): csak sorszám, dátum és állapot. A régi szerverválasz sem tud nevet mutatni.
        const meghivottSorok = meghivottak.map((m, i) => h("div", { class: "lrow" },
            h("div", { class: "lrow-main" },
                h("div", { class: "lrow-v" }, L.invListItem(Number.isFinite(m.sorszam) && m.sorszam > 0 ? m.sorszam : i + 1)),
                m.ms > 0 ? h("div", { class: "lrow-meta" }, dateText(m.ms)) : null),
            h("div", { class: "lrow-side" },
                h("span", { class: "badge " + (m.allapot === "fizetett" ? "b-active" : "b-pending") }, L.invListState[m.allapot] || m.allapot))));

        return h("div", null,

    /**
     * Az alapító helyek élő számláló kártyája (a szerver valódi foglalási adatából). Három állapot: normál, „már csak legfeljebb 5”
     * (borostyán), betelt (arany, nincs ajánlat-szöveg). A szabad helyek száma és a sorszámok a szerver `alapito` adatából jönnek;
     * ha a szerver nem adja ki (a program lezárult), a kártya egyáltalán nem jelenik meg.
     */
    function founderLive(a) {
        const L = t();
        const fmt = (n) => new Intl.NumberFormat(LOCALE[S.lang]).format(Number(n) || 0);
        const osszes = Number(a.osszes) || 0;
        const foglalt = Math.min(Math.max(0, Number(a.foglalt) || 0), osszes);
        const szabad = osszes - foglalt;
        const tele = szabad <= 0;
        const surgos = !tele && szabad <= 5;
        const nap = pb().ingyenesNap;
        const helyek = [];
        for (let i = 1; i <= osszes; i++) {
            helyek.push(h("span", { class: "fk-seat" + (i <= foglalt ? " f" : "") + (!tele && i === foglalt + 1 ? " next" : ""), style: `--i:${i}` }, String(i)));
        }
        return h("div", { class: "fk" + (tele ? " tele" : surgos ? " sur" : "") },
            h("div", { class: "fk-top" },
                h("span", { class: "fk-badge" }, L.fkBadge),
                h("span", { class: "fk-live", title: L.fkLiveTip }, h("i"), tele ? L.fkClosedTag : L.fkLive)),
            tele
                ? [h("div", { class: "fk-end" }, L.fkEnd), h("div", { class: "fk-endsub" }, L.fkEndSub(fmt(osszes)))]
                : h("div", { class: "fk-hero" },
                    h("div", { class: "fk-big" }, fmt(szabad)),
                    h("div", { class: "fk-ht" }, surgos ? L.fkLast(szabad) : L.fkFree, h("small", null, L.fkOf(fmt(osszes))))),
            h("div", { class: "fk-seats", role: "img", "aria-label": L.pubFounderAria(foglalt, osszes) }, helyek),
            h("div", { class: "fk-bar" }, h("b", { style: `--w:${osszes ? (foglalt / osszes) * 100 : 0}%` })),
            h("div", { class: "fk-barl" },
                h("span", null, h("strong", null, `${fmt(foglalt)} / ${fmt(osszes)}`), ` ${L.fkTakenWord}`),
                h("span", null, tele ? "" : L.fkLeft(fmt(szabad)))),
            tele ? null : h("div", { class: "fk-offer" }, L.fkOffer(fmt(osszes), nap)),
            tele ? null : h("div", { class: "fk-cond" }, L.fkCond),
            h("details", null, h("summary", null, L.fkHow), h("p", null, L.fkHowText)));
    }

    function pubCard() {
        const L = t();
        const p = S.pub;
        if (!p) return null;
        const fmt = (n) => new Intl.NumberFormat(LOCALE[S.lang]).format(Number(n) || 0);
        const a = p.alapito && Number(p.alapito.osszes) > 0 ? p.alapito : null;
        // A három közösségi számot (cég, munkavállaló, aktív hirdetés) csak akkor mutatjuk, ha a szerver kiadja (a szerveroldali
        // kapcsoló KI-állapotában nem adja ki): hiányzó szám helyett sosem jelenik meg „0”.
        const vanKozossegi = [p.cegek, p.munkavallalok, p.aktivHirdetesek].every((v) => typeof v === "number");
        // Az alapító kártya csak akkor, ha a szerver kiadja az `alapito` adatot (a program lezárása után nem adja ki).
        const blokkok = [];
        if (vanKozossegi) {

                h("div", { class: "pub-tiles" },

        }
        if (a) blokkok.push(founderLive(a));
        return blokkok.length ? h("div", null, blokkok) : null;

    function viewLogin() {
        const L = t();
        const email = h("input", { type: "email", id: "login-email", autocomplete: "username", inputmode: "email", value: S.loginEmail });
        email.addEventListener("input", () => { S.loginEmail = email.value; });
        const pw = h("input", { type: "password", id: "login-pw", autocomplete: "current-password" });
        const btn = h("button", { class: "btn", type: "submit", disabled: S.busy }, S.busy ? L.loggingIn : L.loginBtn);
        const form = h("form", { novalidate: true },
            h("label", { for: "login-email" }, L.email), email,
            h("label", { for: "login-pw" }, L.password), pw,

            h("div", { class: "row-links" },
                h("button", { class: "link-btn", type: "button", onclick: () => { setMsg(null); show("forgot"); } }, L.forgot))
        );
        form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const e = email.value.trim();
            if (!e || !pw.value) { setMsg("hiba", L.errFill); render(); return; }
            S.busy = true; setMsg(null); render();
            try {
                await signInWithEmailAndPassword(auth, e, pw.value);
                S.busy = false; // a folytatást az onAuthStateChanged végzi
            } catch (err) {
                S.busy = false;
                const k = (err && err.code) || "";
                const szoveg =
                    k === "auth/too-many-requests" ? L.errTooMany :
                    k === "auth/network-request-failed" ? L.errNetwork :
                    k === "auth/invalid-email" ? L.errEmail :
                    (k === "auth/invalid-credential" || k === "auth/wrong-password" || k === "auth/user-not-found") ? L.errCreds :
                    L.errGeneric;
                setMsg("hiba", szoveg);
                render();
            }
        });
        return h("div", null,
            refBanner(),
            h("div", { class: "center-card" }, h("h1", null, L.loginTitle), h("p", { class: "sub" }, L.loginSub), form),
            pubCard());
    }

    // ── Áttekintés fül ──
    /** Csempék + teendők. Csak olvas: minden művelet a többi fülre vagy az átutalási adatokra visz. */
    function tabOv() {
        const L = t();
        const d = S.data;
        const now = Date.now();
        const hirdetesek = d.hirdetesek;
        const hianyzik = d.hianyzoAdatok || [];
        const allapotok = hirdetesek.map((x) => ({ x, allapot: adState(x, now), info: adInfo(x) }));

        const aktivak = allapotok.filter((e) => e.allapot === "active");
        const hamarosan = aktivak.filter((e) => e.x.lejaratMs - now <= SOON_DAYS * DAY);
        const nyitottak = [];
        hirdetesek.forEach((x) => (x.nyitottFizetesek || []).forEach((f) => nyitottak.push({ f, x })));
        const nyitottOsszeg = nyitottak.reduce((n, e) => n + (e.f.hatralevo > 0 ? e.f.hatralevo : e.f.osszeg), 0);
        const fizetesek = d.fizetesek || [];
        const teljesitett = fizetesek.filter((p) => p.statusz === "sikeres").length;

        // A csempék kattinthatók: a hozzájuk tartozó fülre visznek.
        const csempe = (kulcs, ertek, alcim, szin, ful) => h("button", { class: "tile", type: "button", onclick: () => goTab(ful) },
            h("div", { class: "tk" }, kulcs),
            h("div", { class: "tv" + (szin ? ` ${szin}` : "") }, ertek),
            h("div", { class: "ts" }, alcim));
        const csempek = h("div", { class: "tiles" },
            csempe(L.tileActive, String(aktivak.length), L.tileActiveSub(hirdetesek.length), "g", "ads"),
            csempe(L.tileSoon, String(hamarosan.length), L.tileSoonSub(SOON_DAYS), "o", "ads"),
            csempe(L.tileOpen, String(nyitottak.length), nyitottak.length ? L.tileOpenSub(money(nyitottOsszeg)) : L.tileOpenNone, "p", "pay"),
            csempe(L.tileAll, String(fizetesek.length), fizetesek.length ? L.tileAllSub(teljesitett) : L.tileAllNone, "", "pay"));

        // Teendők, fontossági sorrendben
        const sorok = [];
        const sor = (jel, jelOsztaly, cim, meta, gomb) => h("div", { class: "lrow" },
            h("div", { class: "lrow-left" },
                h("div", { class: "ic " + jelOsztaly, "aria-hidden": "true" }, jel),
                h("div", { class: "lrow-main" }, h("div", { class: "lrow-v" }, cim), meta ? h("div", { class: "lrow-meta" }, meta) : null)),
            gomb || null);
        const gombEl = (felirat, fn, elsodleges) => h("button", { class: "mbtn todo-act" + (elsodleges ? " primary" : ""), type: "button", onclick: fn }, felirat);

        if (hianyzik.length) {
            sorok.push(sor("!", "r", L.todoBilling, L.todoBillingMeta(hianyzik.map((k) => L.fields[k] || k).join(", ")),
                gombEl(L.btnCompany, () => goTab("co"))));
        }
        hamarosan.forEach((e) => {
            const nap = Math.ceil((e.x.lejaratMs - now) / DAY);
            sorok.push(sor("!", "w", L.todoExpiring(e.x.pozicio || "—", nap), L.adExpires(dateText(e.x.lejaratMs)),
                e.info.csomagElerheto ? gombEl(L.btnExtend, () => goBuy(e.x, "csomag")) : null));
        });
        nyitottak.forEach(({ f, x }) => {
            sorok.push(sor("↗", "b", L.todoTransfer(adTitle(x)),
                [h("span", { class: "mono" }, f.kozlemeny), ` · ${money(f.hatralevo > 0 ? f.hatralevo : f.osszeg)} · ${L.payDeadline(dateText(f.lejarMs))}`],
                gombEl(L.btnTransfer, () => openBank(f, x))));
        });
        allapotok.forEach((e) => {
            if (e.allapot === "expired") {
                sorok.push(sor("+", "r", L.todoExpired(e.x.pozicio || "—"), `${L.adExpiredOn(dateText(e.x.lejaratMs))} · ${L.todoReappear}`,
                    e.info.csomagElerheto ? gombEl(L.btnExtend, () => goBuy(e.x, "csomag"), true) : null));
            } else if (e.allapot === "inactive") {
                const ingyen = founderEligibleAd(e.x) ? gombEl(L.btnActivateFree, () => goBuy(e.x, "csomag"), true) : null;
                const vasarol = e.info.csomagElerheto ? gombEl(L.btnBuyPack, () => goBuy(e.x, "csomag"), !ingyen) : null;
                sorok.push(sor("+", "r", L.todoInactive(e.x.pozicio || "—"), L.todoInactiveMeta,
                    ingyen || vasarol ? h("div", { class: "todo-btns" }, ingyen, vasarol) : null));
            }
        });
        // A szüneteltetett hirdetés csak tájékoztatás (nincs teendő vele a weben), ezért a lista végére kerül.
        allapotok.filter((e) => e.allapot === "paused").forEach((e) => {
            sorok.push(sor("i", "b", L.todoPaused(e.x.pozicio || "—"), L.todoPausedMeta(dateText(e.x.lejaratMs)), null));
        });

        let teendok;
        if (hirdetesek.length === 0) teendok = emptyBox(L.noAdsTitle, L.noAdsText);
        else if (sorok.length === 0) teendok = emptyBox(L.todoNoneTitle, L.todoNoneText);
        else teendok = h("div", { class: "card" }, sorok);

        return h("div", null,
            topline(L.ovTitle(d.cegNev || ""), L.ovSub),
            msgBox(),
            csempek,
            programBanners(),
            h("div", { class: "sec" }, L.todoTitle),
            teendok);
    }

    function tabBuy() {
        const L = t();
        const d = S.data;
        if (d.hirdetesek.length === 0) {
            return h("div", null, topline(L.shopTitle, L.shopSub), flowStrip(),
                h("div", { class: "empty-box" }, h("b", null, L.noAdsTitle), L.noAdsText));
        }
        const kivalasztott = ad();
        const info = adInfo(kivalasztott);
        const hianyzik = d.hianyzoAdatok || [];

        // 1. Hirdetés
        const hirdetesLista = h("div", { role: "radiogroup", "aria-label": L.step1 },
            d.hirdetesek.map((x) => {
                const xi = adInfo(x);
                const aktivMost = x.aktiv && x.lejaratMs > Date.now();
                return h("button", {
                    class: "opt" + (x.id === S.adId ? " sel" : ""), type: "button", role: "radio",
                    "aria-checked": x.id === S.adId ? "true" : "false",
                    onclick: () => { S.adId = x.id; S.mode = "csomag"; S.hl = ""; setMsg(null); ensureSelection(); render(); }
                },
                    h("span", { class: "rad" }),
                    h("span", { class: "opt-main" },
                        h("span", { class: "opt-title", style: "display:block" }, [x.pozicio || "—", x.helyszin ? ` – ${x.helyszin}` : ""].join(""))),
                    h("span", { class: "badges" },
                        aktivMost
                            ? h("span", { class: "badge b-active" }, `${L.statusActive} · ${L.daysLeft(xi.hatralevoNap)}`)
                            : h("span", { class: "badge b-inactive" }, L.statusInactive),
                        xi.nyitottak.length ? h("span", { class: "badge b-pending" }, L.pending) : null));
            }));

        // Folyamatban lévő fizetések a kiválasztott hirdetésnél
        const nyitottBlokkok = info.nyitottak.map((f) => h("div", { class: "open-box" },
            h("div", { class: "t" }, L.openTitle),
            h("div", { class: "m" }, L.openText(describePurchase(f.vasarlasTipus, f.csomagKod, f.kiemelesKod), money(f.hatralevo > 0 ? f.hatralevo : f.osszeg))),
            h("button", { class: "btn secondary", type: "button", onclick: () => openBank(f, kivalasztott) }, L.openShow)));

        // Mód: csomag / csak kiemelés
        const lehetoseg = [];
        if (info.csomagElerheto) lehetoseg.push("csomag");
        if (info.kiemelesElerheto) lehetoseg.push("kiemeles");
        const modok = lehetoseg.length > 1
            ? h("div", { class: "modes", role: "tablist" }, lehetoseg.map((m) => h("button", {
                class: "mode" + (S.mode === m ? " sel" : ""), type: "button", role: "tab", "aria-selected": S.mode === m ? "true" : "false",
                onclick: () => { S.mode = m; if (m === "kiemeles" && !S.hl) S.hl = (d.arak.kiemelesek[0] || {}).kod || ""; setMsg(null); render(); }
            }, m === "csomag" ? L.modePack : L.modeHl)))
            : null;

        let vasarlasResz;
        if (lehetoseg.length === 0) {
            vasarlasResz = h("div", { class: "note" }, info.nyitottak.length ? L.allOpen : L.hlNeedsActive);
        } else {
            const csomagGrid = h("div", { class: "grid4" }, d.arak.csomagok.map((c) => h("button", {
                class: "pkg" + (S.pack === c.kod ? " sel" : ""), type: "button", "aria-pressed": S.pack === c.kod ? "true" : "false",
                onclick: () => { S.pack = c.kod; setMsg(null); render(); }
            }, h("div", { class: "n" }, packName(c.kod)), h("div", { class: "d" }, durationText(c.nap)), h("div", { class: "pr" }, money(listShown(c.ar))), h("div", { class: "pn" }, isReverse() ? L.netSuffix : L.grossSuffix))));
            const hlOpciok = [];
            if (S.mode === "csomag") {
                hlOpciok.push(h("button", {
                    class: "pkg" + (S.hl === "" ? " sel" : ""), type: "button", "aria-pressed": S.hl === "" ? "true" : "false",
                    onclick: () => { S.hl = ""; setMsg(null); render(); }
                }, h("div", { class: "n" }, L.none), h("div", { class: "d" }, " "), h("div", { class: "pr" }, money(0)), h("div", { class: "pn" }, "\u00a0")));
            }
            d.arak.kiemelesek.forEach((k) => hlOpciok.push(h("button", {
                class: "pkg" + (S.hl === k.kod ? " sel" : ""), type: "button", "aria-pressed": S.hl === k.kod ? "true" : "false",
                onclick: () => { S.hl = k.kod; setMsg(null); render(); }
            }, h("div", { class: "n" }, durationText(k.nap)), h("div", { class: "d" }, " "), h("div", { class: "pr" }, money(listShown(k.ar))), h("div", { class: "pn" }, isReverse() ? L.netSuffix : L.grossSuffix))));
            vasarlasResz = h("div", null,
                S.mode === "csomag" ? [h("div", { class: "step" }, L.step2), csomagGrid] : null,
                h("div", { class: "step" }, S.mode === "csomag" ? L.step3 : L.step2hl),
                h("div", { class: "grid4" }, hlOpciok));
        }

        // Összegzés
        const csomag = lehetoseg.length > 0 && S.mode === "csomag" ? ar(d.arak.csomagok, S.pack) : null;
        const kiemeles = lehetoseg.length > 0 && S.hl ? ar(d.arak.kiemelesek, S.hl) : null;
        ensurePreview();
        const pv = currentPreview();
        const kedv = pv && pv.kedvezmeny && pv.arKedvezmennyel ? pv.kedvezmeny : null;
        const hasznal = !!kedv && S.useDiscount;
        const A = pv ? (hasznal ? pv.arKedvezmennyel : pv.ar) : null;
        // A szerver figyelmeztetése (pl. a külföldi cég uniós adószáma még nincs jóváhagyva): ilyenkor a fizetés nem indítható.
        const figy = pv && pv.figyelmeztetes && pv.figyelmeztetes !== "BILLING_DETAILS_MISSING" ? pv.figyelmeztetes : null;
        const lehetVenni = lehetoseg.length > 0 && hianyzik.length === 0 && (S.mode === "csomag" ? !!csomag : !!kiemeles) && !S.previewBusy && !figy;
        const cimkek = [];
        if (csomag) cimkek.push(L.packageLine(packName(csomag.kod), durationText(csomag.nap)));
        if (kiemeles) cimkek.push(L.highlightLine(durationText(kiemeles.nap)));
        const sor = (cimke, ertek, osztaly) => h("div", { class: "sum-row" + (osztaly ? ` ${osztaly}` : "") }, h("span", null, cimke), h("span", null, ertek));
        const sorok = [h("div", { class: "sum-row" }, h("span", { class: "sum-ad" }, [kivalasztott.pozicio || "—", kivalasztott.helyszin ? ` – ${kivalasztott.helyszin}` : ""].join("")))];
        let osszeg;
        if (A) {
            // A tételek és az összegek a szerver árelőnézetéből jönnek; a feliratot itt, a kiválasztott nyelven adjuk.
            const tetelek = A.sorok.filter((s) => !s.kedvezmeny);
            const kedvSor = A.sorok.find((s) => s.kedvezmeny);
            sorok.push(h("div", { class: "sum-sub" }, A.fordAdozas ? L.itemsNet : L.itemsGross));
            tetelek.forEach((s, i) => sorok.push(sor(cimkek[i] || s.nev, money(s.osszeg))));
            if (hasznal && kedvSor) {
                sorok.push(sor(L.discLine(kedv.tipus === "udvozlo" ? L.discWelcome : L.discCoupon, kedv.szazalek), `−${money(Math.abs(kedvSor.osszeg))}`, "neg"));
            }
            sorok.push(h("div", { class: "sum-div" }));
            sorok.push(sor(L.net, money(A.netto), "muted"));
            sorok.push(sor(A.fordAdozas ? L.vatReverse : L.vatLine(A.afaSzazalek), money(A.afa), "muted"));
            osszeg = A.osszeg;
        } else {
            // Amíg az árelőnézet tölt (vagy nem érhető el), a listaárat mutatjuk; a fizetendő összeget a szerver a díjbekérőn állítja elő.
            if (csomag) sorok.push(sor(cimkek[0], money(listShown(csomag.ar))));
            if (kiemeles) sorok.push(sor(cimkek[csomag ? 1 : 0], money(listShown(kiemeles.ar))));
            osszeg = (csomag ? listShown(csomag.ar) : 0) + (kiemeles ? listShown(kiemeles.ar) : 0);
        }
        const kapcsolo = kedv ? h("button", {
            class: "disc-toggle " + (hasznal ? "on" : "off"), type: "button", role: "switch", "aria-checked": hasznal ? "true" : "false",
            onclick: () => { S.useDiscount = !S.useDiscount; setMsg(null); render(); }
        },
            h("span", { class: "cb", "aria-hidden": "true" }, "✓"),
            h("span", null,
                h("b", null, L.discToggleTitle(kedv.tipus === "udvozlo" ? L.discWelcome : L.discCoupon, kedv.szazalek)),
                h("span", { class: "s" }, [L.discExpires(dateText(kedv.lejarMs)), kedv.tipus === "udvozlo" ? L.discFirstPack : null,
                    pv.elerhetoKedvezmenyDb > 1 ? L.discMore(pv.elerhetoKedvezmenyDb - 1) : null].filter(Boolean).join(" · ")),
                hasznal ? null : h("span", { class: "s" }, L.discOffHint))) : null;
        const jegyzetek = [];
        if (csomag && info.hatralevoNap > 0) jegyzetek.push(h("div", { class: "note" }, L.extendNote(info.hatralevoNap)));
        // A szerver ugyanígy számol (szamoldAktivalast): a kiemelés vége = a mostani kiemelés vége és a MA közül a későbbi + a kiemelés napjai,
        // de a csomaggal együtt vett kiemelés nem tarthat tovább az új lejáratnál (= a mostani lejárat és a MA közül a későbbi + a csomag napjai).
        if (csomag && kiemeles) {
            const most = Date.now();
            const ujLejaratMs = Math.max(kivalasztott.lejaratMs || 0, most) + csomag.nap * DAY;
            const ujKiemelesMs = Math.max(kivalasztott.kiemelesLejaratMs || 0, most) + kiemeles.nap * DAY;
            if (ujKiemelesMs > ujLejaratMs) jegyzetek.push(h("div", { class: "note" }, L.hlCapNote));
        }

        if (A && A.fordAdozas) jegyzetek.push(h("div", { class: "note" }, L.euNote));
        if (figy) jegyzetek.push(h("div", { class: "error-box", role: "alert" }, payError({ message: figy })));
        if (S.previewBusy) {
            jegyzetek.push(h("div", { class: "sum-load" }, L.previewWait));
        } else if (S.previewHiba && lehetoseg.length > 0) {
            jegyzetek.push(h("div", { class: "note" }, `${L.previewFail} `,
                h("button", { class: "link-btn", type: "button", onclick: () => { ensurePreview(true); render(); } }, L.previewRetry)));
        }

        const osszegzes = h("div", { class: "sum" },
            h("h3", null, L.summary), kapcsolo, sorok,
            h("div", { class: "tot" }, h("span", null, L.total), h("span", null, money(osszeg))),
            jegyzetek,
            msgBox(),
            h("button", { class: "btn", type: "button", disabled: !lehetVenni || S.busy, onclick: requestPayment }, S.busy ? L.reqBusy : L.reqBtn),
            h("p", { class: "fine" }, L.fine));

        return h("div", null,
            topline(L.shopTitle, L.shopSub),
            flowStrip(),
            hianyzik.length ? h("div", { class: "warn-box" }, h("b", null, L.missingTitle), h("br"),
                L.missingText(hianyzik.map((k) => L.fields[k] || k).join(", "))) : null,
            h("div", { class: "layout" },
                h("div", null,
                    h("div", { class: "step first" }, L.step1), hirdetesLista,
                    nyitottBlokkok, founderCard(kivalasztott, info), modok, vasarlasResz),
                h("aside", { class: "side" }, osszegzes, trustLines())));
    }

    function emptyBox(cim, szoveg) {
        return h("div", { class: "empty-box" }, h("b", null, cim), szoveg);
    }

    // ── Hirdetéseim fül ──
    function tabAds() {
        const L = t();
        const d = S.data;
        const now = Date.now();
        const tartalom = d.hirdetesek.length === 0
            ? emptyBox(L.noAdsTitle, L.noAdsText)
            : h("div", { class: "card" }, d.hirdetesek.map((x) => {
                const info = adInfo(x);
                const allapot = adState(x, now);
                const nyitott = info.nyitottak[0] || null;
                const hasIdeje = x.lejaratMs > now;

                const elso = [];
                if (allapot === "active" || allapot === "paused") {
                    elso.push(L.adExpires(dateText(x.lejaratMs)));
                    if (allapot === "active" && x.kiemelesLejaratMs > now) elso.push(L.adHlUntil(dateText(x.kiemelesLejaratMs)));
                } else if (allapot === "expired") {
                    elso.push(L.adExpiredOn(dateText(x.lejaratMs)));
                } else if (!nyitott) {
                    elso.push(L.adNeverPaid);
                }

                const gombok = [];
                if (info.csomagElerheto) {
                    if (!nyitott && founderEligibleAd(x)) {
                        gombok.push(h("button", { class: "mbtn primary", type: "button", onclick: () => goBuy(x, "csomag") }, L.btnActivateFree));
                    }
                    gombok.push(h("button", {
                        class: "mbtn" + (hasIdeje || founderEligibleAd(x) ? "" : " primary"), type: "button", onclick: () => goBuy(x, "csomag")
                    }, hasIdeje ? L.btnExtend : L.btnBuyPack));
                }
                if (allapot === "active" && info.kiemelesElerheto) {
                    gombok.push(h("button", { class: "mbtn", type: "button", onclick: () => goBuy(x, "kiemeles") }, L.btnHighlight));
                }
                if (nyitott) {
                    gombok.push(h("button", { class: "mbtn", type: "button", onclick: () => openBank(nyitott, x) }, L.btnTransfer));
                }

                return h("div", { class: "lrow" },
                    h("div", { class: "lrow-main" },
                        h("div", { class: "lrow-v" }, adTitle(x)),
                        elso.length ? h("div", { class: "lrow-meta" }, elso.join(" · ")) : null,
                        nyitott ? h("div", { class: "lrow-meta" }, L.adTransfer(nyitott.kozlemeny, dateText(nyitott.lejarMs))) : null),
                    h("div", { class: "lrow-side" },
                        h("span", { class: "badge " + (allapot === "active" ? "b-active" : allapot === "paused" ? "b-expired" : "b-inactive") }, L.adStatus[allapot]),
                        nyitott ? h("span", { class: "badge b-pending" }, L.pending) : null,
                        gombok));
            }));
        return h("div", null, topline(L.adsTitle, L.adsSub), tartalom);
    }

    // ── Fizetések fül ──
    const PAY_BADGE = { varakozik: "b-pending", reszleges: "b-pending", sikeres: "b-active", lezarva: "b-expired", lejart: "b-expired" };

    function tabPay() {
        const L = t();
        const d = S.data;
        const now = Date.now();
        const lista = d.fizetesek || [];
        const tartalom = lista.length === 0
            ? emptyBox(L.payEmptyTitle, L.payEmptyText)
            : h("div", { class: "card" }, lista.map((p) => {
                // Ha a határidő már lejárt, de a rendszer még nem zárta le, a cégnek már lejártként mutatjuk.
                const statusz = p.statusz === "varakozik" && p.lejarMs > 0 && p.lejarMs <= now ? "lejart" : p.statusz;
                const nyitott = statusz === "varakozik" || statusz === "reszleges" ? findOpenPayment(p.kozlemeny) : null;
                const mit = describePurchase(p.vasarlasTipus, p.csomagKod, p.kiemelesKod);
                const cim = [p.pozicio ? adTitle(p) : L.deletedAd, mit].filter(Boolean).join(" · ");
                const pdfGomb = (tipus, felirat) => {
                    const foglalt = S.pdfBusy === `${p.kozlemeny}|${tipus}`;
                    return h("button", {
                        class: "pdfbtn", type: "button", disabled: !!S.pdfBusy, "aria-label": `${felirat} PDF`,
                        onclick: () => downloadPdf(p.kozlemeny, tipus)
                    }, h("span", { class: "pdftag", "aria-hidden": "true" }, "PDF"), foglalt ? L.pdfBusy : felirat);
                };
                const metaReszek = [];
                if (p.letrehozvaMs > 0) metaReszek.push(dateText(p.letrehozvaMs));
                if (p.kedvezmenySzazalek > 0) metaReszek.push(L.discBadge(p.kedvezmenySzazalek));
                if (nyitott) metaReszek.push(L.payDeadline(dateText(nyitott.f.lejarMs)));
                return h("div", { class: "lrow" },
                    h("div", { class: "lrow-main" },
                        h("div", { class: "lrow-v" }, cim),
                        h("div", { class: "lrow-meta" }, h("span", { class: "mono" }, p.kozlemeny), metaReszek.length ? ` · ${metaReszek.join(" · ")}` : ""),
                        statusz === "reszleges" && p.befizetve > 0 ? h("div", { class: "lrow-meta" }, `${L.alreadyPaid}: ${money(p.befizetve)}`) : null),
                    h("div", { class: "lrow-side" },
                        h("span", { class: "amt" }, money(p.osszeg)),
                        h("span", { class: "badge " + (PAY_BADGE[statusz] || "b-expired") }, L.payStatus[statusz] || statusz),
                        p.szamlaPdf === true ? pdfGomb("szamla", L.pdfSzamla) : null,
                        // A határidő után már lejártként mutatott fizetés díjbekérője hamarosan törlődik: nem kínáljuk fel.
                        p.dijbekeroPdf === true && statusz !== "lejart" ? pdfGomb("dijbekero", L.pdfDijbekero) : null,
                        nyitott ? h("button", { class: "mbtn", type: "button", onclick: () => openBank(nyitott.f, nyitott.hirdetes) }, L.btnTransfer) : null));
            }));
        const vanPdf = lista.some((p) => p.szamlaPdf === true || p.dijbekeroPdf === true);
        return h("div", null, topline(L.payTitle, vanPdf ? `${L.paySub} ${L.paySubPdf}` : L.paySub), msgBox(), tartalom,
            lista.length ? h("div", { class: "info-note" }, h("span", { "aria-hidden": "true" }, "ⓘ"), h("span", null, L.payNote)) : null);
    }

    // ── Cégadatok fül (csak megjelenítés; a módosítás az appban történik) ──

                    hianyzik.length === 0
