<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>VJob – Hirdetés vásárlása</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #07060E;
            color: #e2e0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: #C084FC; }

        .header {
            background: linear-gradient(135deg, #0D0B1E 0%, #1A0A2E 100%);
            border-bottom: 1px solid rgba(180, 80, 255, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header-inner {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #8B2FC9, #D946EF);
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; color: white;
            box-shadow: 0 0 20px rgba(180, 80, 255, 0.4);
        }
        .logo-text {
            font-size: 21px; font-weight: 800;
            background: linear-gradient(135deg, #C084FC, #E879F9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .who { font-size: 13px; color: #b5b2cc; display: flex; align-items: center; gap: 10px; }
        .who.acc { padding: 4px 14px 4px 4px; border: 1px solid rgba(255,255,255,0.14); border-radius: 30px; background: rgba(255,255,255,0.04); }
        .who-name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; color: #fff; }
        .av {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(192,132,252,0.18); color: #E9D5FF; font-weight: 800; font-size: 12px;
            border: 2px solid rgba(192,132,252,0.55);
        }
        .av.has-img { background: #fff; }
        .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .av.big-av { width: 68px; height: 68px; border-radius: 16px; font-size: 24px; }
        .link-btn {
            background: none; border: none; color: #C084FC; cursor: pointer;
            font: inherit; font-size: 13px; text-decoration: underline; padding: 4px 0;
        }
        .lang-switcher {
            display: flex; gap: 4px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 3px;
        }
        .lang-btn {
            padding: 6px 12px; border: none; border-radius: 7px; background: transparent;
            color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #8B2FC9, #D946EF); color: white;
            box-shadow: 0 2px 10px rgba(180, 80, 255, 0.4);
        }
        .lang-btn:hover:not(.active) { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.07); }

        main { flex: 1; width: 100%; max-width: 980px; margin: 0 auto; padding: 36px 24px 60px; }

        h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: #fff; }
        .sub { font-size: 14px; color: rgba(255,255,255,0.58); line-height: 1.55; margin-bottom: 22px; }

        .center-card {
            max-width: 430px; margin: 24px auto 0;
            background: #0D0B1A; border: 1px solid rgba(136, 0, 255, 0.25);
            border-radius: 20px; padding: 30px 28px;
        }
        .center-card h1 { font-size: 22px; }
        label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.14);
            border-radius: 10px; padding: 13px 14px; color: #fff; font-size: 16px; font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: rgba(170, 68, 255, 0.7); }

        .btn {
            width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #8800FF, #DD00BB); color: #fff;
            font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.92; }
        .btn.secondary {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.88);
        }
        .row-links { margin-top: 16px; text-align: center; }

        .error-box {
            background: rgba(255, 68, 85, 0.1); border: 1px solid rgba(255, 68, 85, 0.35); border-radius: 10px;
            padding: 12px 14px; color: #FF9AA6; font-size: 13.5px; margin-top: 16px; line-height: 1.5;
        }
        .ok-box {
            background: rgba(0, 200, 120, 0.1); border: 1px solid rgba(0, 200, 120, 0.35); border-radius: 10px;
            padding: 12px 14px; color: #6FE3B2; font-size: 13.5px; margin-top: 16px; line-height: 1.5;
        }
        .warn-box {
            background: rgba(255, 176, 32, 0.09); border: 1px solid rgba(255, 176, 32, 0.4); border-radius: 12px;
            padding: 14px 16px; color: #FFD27A; font-size: 13.5px; line-height: 1.55; margin-bottom: 18px;
        }
        .warn-box b { color: #FFE2A6; }

        .spinner {
            width: 38px; height: 38px; border: 3px solid rgba(170, 68, 255, 0.2); border-top-color: #AA44FF;
            border-radius: 50%; margin: 60px auto 16px; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .center-text { text-align: center; color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; }
        .center-text .btn { max-width: 260px; margin-left: auto; margin-right: auto; display: block; }

        /* ── Vásárlás ── */
        .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
        .step { font-size: 11.5px; font-weight: 800; letter-spacing: 1.3px; color: #C084FC; text-transform: uppercase; margin: 22px 0 10px; }
        .step.first { margin-top: 4px; }
        .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }

        .opt {
            display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
            border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); color: inherit;
            border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font: inherit; font-size: 14px; cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .opt:hover { border-color: rgba(180,80,255,0.4); }
        .opt.sel { border-color: #C084FC; background: rgba(139,47,201,0.16); }
        .rad { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; }
        .sel .rad { border-color: #E879F9; background: radial-gradient(#E879F9 45%, transparent 50%); }
        .opt-main { flex: 1; min-width: 0; }
        .opt-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .badge { font-size: 12px; padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
        .b-active { color: #00eda0; background: rgba(0,200,120,0.14); }
        .b-inactive { color: #ff7a5c; background: rgba(255,68,0,0.14); }
        .b-pending { color: #ffb020; background: rgba(255,176,32,0.14); }

        .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .pkg {
            border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); color: inherit;
            border-radius: 12px; padding: 14px 8px; text-align: center; font: inherit; cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .pkg:hover { border-color: rgba(180,80,255,0.4); }
        .pkg.sel { border-color: #C084FC; background: rgba(139,47,201,0.16); }
        .pkg .n { font-weight: 800; font-size: 14px; }
        .pkg .d { font-size: 12px; color: rgba(255,255,255,0.55); margin: 3px 0 7px; }
        .pkg .pr { font-weight: 800; font-size: 15px; color: #E879F9; }

        .modes { display: flex; gap: 8px; margin: 18px 0 0; flex-wrap: wrap; }
        .mode {
            padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.14); background: transparent;
            color: rgba(255,255,255,0.65); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .mode.sel { background: rgba(139,47,201,0.25); border-color: #C084FC; color: #fff; }

        .open-box {
            border: 1px solid rgba(255,176,32,0.4); background: rgba(255,176,32,0.07); border-radius: 12px;
            padding: 12px 14px; margin: 10px 0; font-size: 13.5px;
        }
        .open-box .t { font-weight: 700; color: #FFD27A; margin-bottom: 4px; }
        .open-box .m { color: rgba(255,255,255,0.7); line-height: 1.5; }
        .open-box .btn { margin-top: 10px; padding: 10px; font-size: 13.5px; }

        .side { position: sticky; top: 92px; }
        .sum { border: 1px solid rgba(180,80,255,0.28); background: #150C26; border-radius: 16px; padding: 20px; }
        .sum h3 { font-size: 15px; margin-bottom: 14px; color: #fff; }
        .sum-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; color: #cfcde0; margin-bottom: 9px; }
        .sum-row span:last-child { white-space: nowrap; }
        .sum-ad { font-weight: 600; color: #fff; overflow-wrap: anywhere; }
        .tot { border-top: 1px solid rgba(255,255,255,0.14); margin-top: 12px; padding-top: 14px; display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; color: #fff; }
        .fine { font-size: 11.5px; color: rgba(255,255,255,0.5); line-height: 1.55; margin-top: 14px; }
        .note { font-size: 12.5px; color: rgba(255,255,255,0.62); line-height: 1.5; margin-top: 10px; }

        /* ── Átutalási adatok ── */
        .bank-wrap { max-width: 640px; margin: 0 auto; }
        .status-pill {
            display: inline-block; font-size: 12.5px; font-weight: 700; color: #ffb020; background: rgba(255,176,32,0.1);
            border: 1px solid rgba(255,176,32,0.4); padding: 5px 12px; border-radius: 20px; margin-bottom: 14px;
        }
        .kv { border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; overflow: hidden; margin-top: 16px; }
        .kv-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; font-size: 14.5px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .kv-row:last-child { border-bottom: none; }
        .kv-k { color: rgba(255,255,255,0.55); flex-shrink: 0; }
        .kv-v { font-weight: 700; text-align: right; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
        .kv-v.big { font-size: 20px; color: #E879F9; }
        .copy {
            border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85);
            border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
        }
        .copy:hover { border-color: rgba(180,80,255,0.5); }
        .copy.done { color: #6FE3B2; border-color: rgba(0,200,120,0.5); }
        .bank-wrap .btn { max-width: 320px; }

        /* ── Fiók: fülek ── */
        .nav { border-bottom: 1px solid rgba(255,255,255,0.08); }
        .nav-inner { position: relative; max-width: 980px; margin: 0 auto; padding: 0 8px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .nav-inner::-webkit-scrollbar { display: none; }
        .tab {
            display: flex; align-items: center; gap: 7px; padding: 15px 16px; background: none; border: none;
            border-bottom: 2px solid transparent; color: rgba(255,255,255,0.55); font: inherit; font-size: 14px; font-weight: 600;
            cursor: pointer; white-space: nowrap;
        }
        .tab:hover { color: rgba(255,255,255,0.85); }
        .tab.active { color: #fff; border-bottom-color: #D946EF; }
        .tab-badge { background: rgba(255,176,32,0.16); color: #ffb020; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }

        /* ── Fiók: 3 lépéses sáv és bizalmi sor ── */
        .flow { display: flex; border: 1px solid rgba(180,80,255,0.28); background: #110A20; border-radius: 16px; overflow: hidden; margin: 0 0 26px; }
        .flow-st { flex: 1; padding: 16px 18px; display: flex; gap: 13px; align-items: flex-start; }
        .flow-st + .flow-st { border-left: 1px solid rgba(255,255,255,0.08); }
        .flow-num {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #8B2FC9, #D946EF); color: #fff; font-weight: 800; font-size: 14px;
        }
        .flow-st.last .flow-num { background: linear-gradient(135deg, #0DAA70, #00EDA0); color: #04210F; }
        .flow-st b { display: block; color: #fff; font-size: 14px; margin-bottom: 3px; }
        .flow-st .d { font-size: 12.5px; color: rgba(255,255,255,0.62); line-height: 1.45; }
        .trust { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .tr { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; color: rgba(255,255,255,0.72); line-height: 1.4; }
        .ck {
            width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,200,120,0.16); color: #00eda0; font-size: 10px; font-weight: 900;
        }
        .empty-box { border: 1px dashed rgba(255,255,255,0.18); border-radius: 14px; padding: 26px 22px; text-align: center; color: rgba(255,255,255,0.62); font-size: 14px; line-height: 1.6; }
        .empty-box b { display: block; color: #fff; font-size: 16px; margin-bottom: 6px; }

        /* ── Fiók: listák (hirdetések, fizetések) ── */
        .card { border: 1px solid rgba(180,80,255,0.25); background: #110A20; border-radius: 16px; padding: 4px 22px; }
        .lrow { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .lrow:last-child { border-bottom: none; }
        .lrow-main { min-width: 0; flex: 1; }
        .lrow-v { font-size: 14.5px; font-weight: 600; color: #fff; overflow-wrap: anywhere; }
        .lrow-meta { font-size: 12.5px; color: rgba(255,255,255,0.55); margin-top: 3px; line-height: 1.45; overflow-wrap: anywhere; }
        .lrow-side { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .amt { font-weight: 800; font-size: 14.5px; color: #fff; white-space: nowrap; }
        .mono { font-family: Consolas, Menlo, monospace; letter-spacing: 0.4px; }
        .mbtn {
            padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.07);
            color: #e2e0f0; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .mbtn:hover { border-color: rgba(180,80,255,0.5); }
        .mbtn.primary { background: linear-gradient(135deg, #8800FF, #DD00BB); border-color: transparent; color: #fff; }
        .b-expired { color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.08); }
        .info-note {
            display: flex; gap: 10px; margin-top: 16px; padding: 13px 15px; border-radius: 12px; font-size: 13px; line-height: 1.5;
            color: rgba(255,255,255,0.65); background: rgba(192,132,252,0.08); border: 1px solid rgba(192,132,252,0.25);
        }

        /* ── Fiók: cégadatok ── */
        .hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .hero-name { font-size: 19px; font-weight: 800; color: #fff; overflow-wrap: anywhere; }
        .hero-main { min-width: 0; flex: 1 1 160px; }
        .ok-line { color: #00eda0; font-size: 12.5px; font-weight: 700; }
        .miss-line { color: #ffb020; font-size: 12.5px; font-weight: 700; }
        .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }
        .frow { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.07); min-width: 0; }
        .fk { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 3px; }
        .fv { font-size: 14.5px; font-weight: 600; color: #fff; overflow-wrap: anywhere; }
        .fv.miss { color: #ffb48f; }

        /* ── Munkavállalói fiók ── */
        .worker-card { max-width: 520px; margin: 30px auto 0; text-align: center; border: 1px solid rgba(180,80,255,0.28); background: #150C26; border-radius: 20px; padding: 38px 34px; }
        .worker-ic {
            width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
            background: rgba(192,132,252,0.14); border: 1px solid rgba(192,132,252,0.5); font-size: 26px;
        }
        .worker-card h1 { font-size: 22px; margin-bottom: 12px; }
        .worker-card p { font-size: 14.5px; line-height: 1.6; color: rgba(255,255,255,0.7); margin-bottom: 10px; }
        .worker-card p.small { font-size: 13px; color: rgba(255,255,255,0.5); }
        .worker-card .btn { max-width: 260px; margin-left: auto; margin-right: auto; display: block; }

        .footer { text-align: center; padding: 22px 24px; border-top: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.35); font-size: 12px; line-height: 1.8; }
        .footer a { color: rgba(255,255,255,0.5); }

        @media (max-width: 820px) {
            .layout { grid-template-columns: minmax(0, 1fr); }
            .side { position: static; }
            .flow { flex-direction: column; }
            .flow-st + .flow-st { border-left: none; border-top: 1px solid rgba(255,255,255,0.08); }
            .fgrid { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 600px) {
            main { padding: 24px 16px 48px; }
            .header { padding: 14px 16px; }
            .grid4 { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 22px; }
            .center-card { padding: 24px 18px; }
            .kv-row { flex-direction: column; align-items: flex-start; gap: 6px; }
            .kv-v { text-align: left; justify-content: flex-start; }
            .opt { flex-wrap: wrap; }
            .opt-main { flex: 1 1 calc(100% - 40px); }
            .badges { flex: 1 0 100%; justify-content: flex-start; padding-left: 28px; }
            .nav-inner { padding: 0; }
            .tab { padding: 14px 12px; font-size: 13.5px; }
            .header-right { display: contents; }
            .logo-area { order: 1; }
            .lang-switcher { order: 2; }
            .who { order: 3; width: 100%; }
            .who .who-name { flex: 1; max-width: none; }
            .card { padding: 2px 16px; }
            .lrow { flex-direction: column; align-items: flex-start; gap: 10px; }
            .lrow-side { justify-content: flex-start; }
            .worker-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="logo-area" href="https://getvjob.app">
            <div class="logo-icon">V</div>
            <span class="logo-text">VJob</span>
        </a>
        <div class="header-right">
            <div class="who acc" id="who" hidden>
                <span id="who-av"></span>
                <span class="who-name" id="who-name"></span>
                <button class="link-btn" id="logout-btn" type="button"></button>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn" type="button" data-lang="hu">HU</button>
                <button class="lang-btn" type="button" data-lang="en">EN</button>
                <button class="lang-btn" type="button" data-lang="de">DE</button>
            </div>
        </div>
    </div>
</header>

<nav class="nav" id="nav" hidden></nav>

<main id="app" aria-live="polite"></main>
<noscript><p class="center-text" style="padding:40px 24px">Az oldal használatához engedélyezze a JavaScriptet. · Please enable JavaScript to use this page.</p></noscript>

<footer class="footer">
    <span id="footer-text"></span><br>
    <a href="terms.html" id="footer-terms"></a> · <a href="privacy-policy.html" id="footer-privacy"></a> · <a href="csomagok.html" id="footer-packages"></a>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
        getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    // ───────────────────────── Állapot ─────────────────────────
    function startLang() {
        const q = new URLSearchParams(location.search).get("lang");
        if (LANGS.includes(q)) return q;
        try {
            const mentett = localStorage.getItem("vjob_lang");
            if (LANGS.includes(mentett)) return mentett;
        } catch (e) { /* a böngésző nem engedi a tárolást: nem baj */ }
        const bongeszo = (navigator.language || "").slice(0, 2).toLowerCase();
        return LANGS.includes(bongeszo) ? bongeszo : "hu";
    }

    const S = {
        lang: startLang(),
        view: "loading",     // loading | login | forgot | account | bank | worker | error
        tab: "buy",          // buy | ads | pay | co (az "account" és "bank" nézetben)
        user: null,
        data: null,          // a listazCegHirdeteseit válasza
        adId: null,
        mode: "csomag",      // csomag | kiemeles
        pack: null,
        hl: "",
        busy: false,
        msg: null,           // { tipus: "hiba"|"ok", szoveg }
        bank: null,
        loginEmail: "",
        eloValasztottHirdetes: new URLSearchParams(location.search).get("hirdetes")
    };

    const t = () => T[S.lang];

    // ───────────────────────── Segédek ─────────────────────────
    const $ = (id) => document.getElementById(id);

    /** Elemet épít; a szöveg MINDIG szövegcsomópontként kerül be (a felhasználói adat nem értelmeződik HTML-ként). */
    function h(tag, props, ...kids) {
        const e = document.createElement(tag);
        if (props) {
            for (const [k, v] of Object.entries(props)) {
                if (v === false || v === null || v === undefined) continue;
                if (k === "class") e.className = v;
                else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
                else e.setAttribute(k, v === true ? "" : v);
            }
        }
        for (const kid of kids.flat()) {
            if (kid === null || kid === undefined || kid === false) continue;
            e.append(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
        }
        return e;
    }

    // Ezreselválasztó minden 4 jegyű számnál is (az Intl a magyarnál a 4 jegyűt nem tagolja: "3000"), mint a csomagok oldalán: "3 000 Ft".
    const THOUSANDS = { hu: "\u00a0", en: ",", de: "." };
    function money(n) {
        const szam = String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, THOUSANDS[S.lang]);
        return `${szam}\u00a0${CURRENCY[S.lang]}`;
    }

    function durationText(nap) {
        return nap === 1 ? t().hoursLabel : `${nap} ${t().unitDays(nap)}`;
    }

    function packName(kod) {
        return t().packNames[kod] || kod;
    }

    function dateText(ms) {
        return new Date(ms).toLocaleDateString(LOCALE[S.lang], { year: "numeric", month: "long", day: "numeric" });
    }

    function daysUntil(ms) {
        return Math.max(1, Math.ceil((ms - Date.now()) / DAY));
    }

    const ar = (lista, kod) => (lista || []).find((x) => x.kod === kod) || null;

    function ad() {
        return (S.data && S.data.hirdetesek.find((x) => x.id === S.adId)) || null;
    }

    /** Mit lehet venni a hirdetéshez (ugyanazok a szabályok, mint az appban és a szerveren). */
    function adInfo(x) {
        const now = Date.now();
        const nyitottak = x.nyitottFizetesek || [];
        const csomagNyitott = nyitottak.some((f) => f.vasarlasTipus !== "kiemeles");
        const kiemelesNyitott = nyitottak.some((f) => f.vasarlasTipus === "kiemeles" || f.kiemelesKod);
        const hatralevoNap = x.lejaratMs > now ? Math.ceil((x.lejaratMs - now) / DAY) : 0;
        return {
            nyitottak,
            hatralevoNap,
            csomagElerheto: !csomagNyitott,
            kiemelesElerheto: x.aktiv === true && !kiemelesNyitott
        };
    }

    function ensureSelection() {
        const d = S.data;
        if (!d || d.hirdetesek.length === 0) return;
        if (!ad()) {
            const kert = S.eloValasztottHirdetes && d.hirdetesek.find((x) => x.id === S.eloValasztottHirdetes);
            const fizetesreSzorulo = d.hirdetesek.find((x) => !(x.aktiv && x.lejaratMs > Date.now()));
            S.adId = (kert || fizetesreSzorulo || d.hirdetesek[0]).id;
            S.eloValasztottHirdetes = null;
        }
        const info = adInfo(ad());
        if (S.mode === "csomag" && !info.csomagElerheto) S.mode = "kiemeles";
        if (S.mode === "kiemeles" && !info.kiemelesElerheto && info.csomagElerheto) S.mode = "csomag";
        if (!ar(d.arak.csomagok, S.pack)) {
            S.pack = (ar(d.arak.csomagok, "kozepes") || d.arak.csomagok[0] || {}).kod || null;
        }
        if (S.hl && !ar(d.arak.kiemelesek, S.hl)) S.hl = "";
        if (S.mode === "kiemeles" && !S.hl) S.hl = (d.arak.kiemelesek[0] || {}).kod || "";
    }

    const TABS = ["buy", "ads", "pay", "co"];
    const TAB_LABEL = { buy: "tabBuy", ads: "tabAds", pay: "tabPay", co: "tabCo" };

    /** Hány nyitott (még kifizetésre váró, le nem járt) fizetése van a cégnek. */
    function openPaymentCount() {
        return S.data ? S.data.hirdetesek.reduce((n, x) => n + (x.nyitottFizetesek || []).length, 0) : 0;
    }

    /** A közlemény alapján megkeresi a nyitott fizetést és a hirdetést, amelyikhez tartozik. */
    function findOpenPayment(kozlemeny) {
        for (const x of S.data.hirdetesek) {
            const f = (x.nyitottFizetesek || []).find((p) => p.kozlemeny === kozlemeny);
            if (f) return { f, hirdetes: x };
        }
        return null;
    }

    function adTitle(x) {
        return [x.pozicio || "—", x.helyszin ? ` – ${x.helyszin}` : ""].join("");
    }

    /** active | paused (szüneteltetett, de van még ideje) | expired | inactive (még nem fizetett) */
    function adState(x, now) {
        if (x.aktiv && x.lejaratMs > now) return "active";
        if (x.lejaratMs > now) return "paused";
        if (x.lejaratMs > 0) return "expired";
        return "inactive";
    }

    function initials() {
        const nev = (S.data && S.data.cegNev) || "";
        const szavak = nev.split(/\s+/).filter((w) => /\p{L}/u.test(w));
        let betuk = szavak.slice(0, 2).map((w) => Array.from(w.replace(/^[^\p{L}]+/u, ""))[0] || "").join("");
        if (!betuk) betuk = Array.from(((S.user && S.user.email) || "").trim())[0] || "V";
        return betuk.toUpperCase();
    }

    /** Kerek (vagy nagy lekerekített) jelvény: a cég logója, és ha nincs vagy nem tölt be, a cégnév kezdőbetűi. */
    function avatar(extra) {
        const box = h("span", { class: "av" + (extra ? ` ${extra}` : ""), "aria-hidden": "true" }, initials());
        const logo = S.data && typeof S.data.logoUrl === "string" && S.data.logoUrl.startsWith("https://") ? S.data.logoUrl : "";
        if (logo) {
            const img = h("img", { src: logo, alt: "", referrerpolicy: "no-referrer", decoding: "async" });
            img.addEventListener("load", () => { box.classList.add("has-img"); box.replaceChildren(img); });
        }
        return box;
    }

    function goTab(k) {
        S.tab = k;
        setMsg(null);
        show("account");
    }

    /** A Hirdetéseim fülről a vásárláshoz ugrik, a hirdetés és a mód előválasztásával. */
    function goBuy(hirdetes, mod) {
        S.adId = hirdetes.id;
        S.mode = mod;
        S.hl = "";
        setMsg(null);
        ensureSelection();
        S.tab = "buy";
        show("account");
    }

    function setMsg(tipus, szoveg) {
        S.msg = szoveg ? { tipus, szoveg } : null;
    }

    function payError(e) {
        const m = (e && e.message) || "";
        const code = (e && e.code) || "";
        const L = t();
        const map = {
            BILLING_DETAILS_MISSING: L.pBilling,
            COMPANY_NOT_VERIFIED: L.pNotVerified,
            HIGHLIGHT_NEEDS_ACTIVE_AD: L.pNeedsActive,
            PAYMENT_ALREADY_OPEN: L.pAlreadyOpen,
            TOO_MANY_OPEN_PAYMENTS: L.pTooMany,
            TEMPORARY_ERROR_TRY_AGAIN: L.pTemp,
            PAYMENT_START_FAILED: L.pFailed
        };
        if (map[m]) return map[m];
        if (code === "functions/unauthenticated") return L.pSession;
        if (code === "functions/not-found") return L.pNotFound;
        if (code === "functions/invalid-argument") return L.pInvalid;
        if (code === "functions/deadline-exceeded" || code === "functions/unavailable") return L.pTimeout;
        return L.pFailed;
    }

    // ───────────────────────── Nézetek ─────────────────────────
    function render() {
        const L = t();
        document.documentElement.lang = S.lang;
        document.title = L.pageTitle;
        document.querySelectorAll(".lang-btn").forEach((b) => b.classList.toggle("active", b.dataset.lang === S.lang));
        $("logout-btn").textContent = L.logout;
        $("footer-text").textContent = L.footer;
        $("footer-terms").textContent = L.terms;
        $("footer-privacy").textContent = L.privacy;
        $("footer-packages").textContent = L.packages;
        const bejelentkezve = !!S.user && S.view !== "login" && S.view !== "forgot";
        $("who").hidden = !bejelentkezve;
        $("who-name").textContent = (S.data && S.data.cegNev) || (S.user && S.user.email) || "";
        $("who-av").replaceChildren(bejelentkezve ? avatar() : "");
        renderNav();

        const app = $("app");
        app.replaceChildren();
        const nezetek = { loading: viewLoading, login: viewLogin, forgot: viewForgot, account: viewAccount, bank: viewBank, worker: viewWorker, error: viewError };
        app.append((nezetek[S.view] || viewLoading)());
    }

    /** A fülsor csak a céges fiók nézeteiben látszik (munkavállalónak és belépés előtt nem). */
    function renderNav() {
        const L = t();
        const nav = $("nav");
        const lathato = !!S.data && !S.data.munkavallalo && (S.view === "account" || S.view === "bank");
        nav.hidden = !lathato;
        nav.replaceChildren();
        if (!lathato) return;
        const nyitott = openPaymentCount();
        nav.append(h("div", { class: "nav-inner", role: "tablist", "aria-label": L.tabsLabel },
            TABS.map((k) => h("button", {
                class: "tab" + (S.tab === k ? " active" : ""), type: "button", role: "tab",
                "aria-selected": S.tab === k ? "true" : "false", "data-tab": k,
                onclick: () => goTab(k)
            }, L[TAB_LABEL[k]], k === "pay" && nyitott > 0 ? h("span", { class: "tab-badge" }, L.openBadge(nyitott)) : null))));
        // Keskeny képernyőn a fülsor görgethető: az aktív fület a látható sávba hozzuk.
        const sor = nav.firstChild;
        const aktiv = sor && sor.querySelector(".tab.active");
        if (aktiv) sor.scrollLeft = Math.max(0, aktiv.offsetLeft - (sor.clientWidth - aktiv.offsetWidth) / 2);
    }

    function show(view) {
        S.view = view;
        render();
        window.scrollTo(0, 0);
    }

    function msgBox() {
        if (!S.msg) return null;
        return h("div", { class: S.msg.tipus === "ok" ? "ok-box" : "error-box", role: "alert" }, S.msg.szoveg);
    }

    function viewLoading() {
        return h("div", null, h("div", { class: "spinner" }), h("p", { class: "center-text" }, t().loading));
    }

    function viewLogin() {
        const L = t();
        const email = h("input", { type: "email", id: "login-email", autocomplete: "username", inputmode: "email", value: S.loginEmail });
        email.addEventListener("input", () => { S.loginEmail = email.value; });
        const pw = h("input", { type: "password", id: "login-pw", autocomplete: "current-password" });
        const btn = h("button", { class: "btn", type: "submit", disabled: S.busy }, S.busy ? L.loggingIn : L.loginBtn);
        const form = h("form", { novalidate: true },
            h("label", { for: "login-email" }, L.email), email,
            h("label", { for: "login-pw" }, L.password), pw,
            msgBox(),
            btn,
            h("div", { class: "row-links" },
                h("button", { class: "link-btn", type: "button", onclick: () => { setMsg(null); show("forgot"); } }, L.forgot))
        );
        form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const e = email.value.trim();
            if (!e || !pw.value) { setMsg("hiba", L.errFill); render(); return; }
            S.busy = true; setMsg(null); render();
            try {
                await signInWithEmailAndPassword(auth, e, pw.value);
                S.busy = false; // a folytatást az onAuthStateChanged végzi
            } catch (err) {
                S.busy = false;
                const k = (err && err.code) || "";
                const szoveg =
                    k === "auth/too-many-requests" ? L.errTooMany :
                    k === "auth/network-request-failed" ? L.errNetwork :
                    k === "auth/invalid-email" ? L.errEmail :
                    (k === "auth/invalid-credential" || k === "auth/wrong-password" || k === "auth/user-not-found") ? L.errCreds :
                    L.errGeneric;
                setMsg("hiba", szoveg);
                render();
            }
        });
        return h("div", { class: "center-card" }, h("h1", null, L.loginTitle), h("p", { class: "sub" }, L.loginSub), form);
    }

    function viewForgot() {
        const L = t();
        const email = h("input", { type: "email", id: "forgot-email", autocomplete: "username", inputmode: "email", value: S.loginEmail });
        email.addEventListener("input", () => { S.loginEmail = email.value; });
        const form = h("form", { novalidate: true },
            h("label", { for: "forgot-email" }, L.email), email,
            msgBox(),
            h("button", { class: "btn", type: "submit", disabled: S.busy }, S.busy ? L.sending : L.sendReset),
            h("div", { class: "row-links" },
                h("button", { class: "link-btn", type: "button", onclick: () => { setMsg(null); show("login"); } }, L.backToLogin))
        );
        form.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const e = email.value.trim();
            if (!e) { setMsg("hiba", L.errEmail); render(); return; }
            S.busy = true; setMsg(null); render();
            try {
                await call("kuldJelszoVisszaallitasEmail", { email: e });
                setMsg("ok", L.resetSent);
            } catch (err) {
                setMsg("hiba", (err && err.code === "functions/invalid-argument") ? L.errEmail : L.errGeneric);
            }
            S.busy = false;
            render();
        });
        return h("div", { class: "center-card" }, h("h1", null, L.forgotTitle), h("p", { class: "sub" }, L.forgotSub), form);
    }

    function viewError() {
        const L = t();
        return h("div", { class: "center-text", style: "padding-top:60px" },
            h("p", null, L.loadError),
            h("button", { class: "btn", type: "button", onclick: loadData }, L.retry));
    }

            h("button", { class: "btn", type: "button", onclick: logout }, L.logout));

    function describePurchase(vasarlasTipus, csomagKod, kiemelesKod) {
        const L = t();
        const d = S.data;
        const reszek = [];
        if (vasarlasTipus !== "kiemeles" && csomagKod) {
            const c = ar(d.arak.csomagok, csomagKod);
            reszek.push(L.packageLine(packName(csomagKod), c ? durationText(c.nap) : ""));
        }
        if (kiemelesKod) {
            const k = ar(d.arak.kiemelesek, kiemelesKod);
            reszek.push(L.highlightLine(k ? durationText(k.nap) : kiemelesKod));
        }
        return reszek.join(" + ");
    }

    function flowStrip() {
        const L = t();
        return h("div", { class: "flow" },
            h("div", { class: "flow-st" }, h("div", { class: "flow-num" }, "1"), h("div", null, h("b", null, L.flow1T), h("span", { class: "d" }, L.flow1D))),
            h("div", { class: "flow-st" }, h("div", { class: "flow-num" }, "2"), h("div", null, h("b", null, L.flow2T), h("span", { class: "d" }, L.flow2D))),
            h("div", { class: "flow-st last" }, h("div", { class: "flow-num" }, "✓"), h("div", null, h("b", null, L.flow3T), h("span", { class: "d" }, L.flow3D))));
    }

    function trustLines() {
        const L = t();
        return h("div", { class: "trust" },
            [L.trust1, L.trust2, L.trust3].map((sor) => h("div", { class: "tr" }, h("div", { class: "ck", "aria-hidden": "true" }, "✓"), h("div", null, sor))));
    }

    function tabBuy() {
        const L = t();
        const d = S.data;
        if (d.hirdetesek.length === 0) {
            return h("div", null, topline(L.shopTitle, L.shopSub), flowStrip(),
                h("div", { class: "empty-box" }, h("b", null, L.noAdsTitle), L.noAdsText));
        }
        const kivalasztott = ad();
        const info = adInfo(kivalasztott);
        const hianyzik = d.hianyzoAdatok || [];

        // 1. Hirdetés
        const hirdetesLista = h("div", { role: "radiogroup", "aria-label": L.step1 },
            d.hirdetesek.map((x) => {
                const xi = adInfo(x);
                const aktivMost = x.aktiv && x.lejaratMs > Date.now();
                return h("button", {
                    class: "opt" + (x.id === S.adId ? " sel" : ""), type: "button", role: "radio",
                    "aria-checked": x.id === S.adId ? "true" : "false",
                    onclick: () => { S.adId = x.id; S.mode = "csomag"; S.hl = ""; setMsg(null); ensureSelection(); render(); }
                },
                    h("span", { class: "rad" }),
                    h("span", { class: "opt-main" },
                        h("span", { class: "opt-title", style: "display:block" }, [x.pozicio || "—", x.helyszin ? ` – ${x.helyszin}` : ""].join(""))),
                    h("span", { class: "badges" },
                        aktivMost
                            ? h("span", { class: "badge b-active" }, `${L.statusActive} · ${L.daysLeft(xi.hatralevoNap)}`)
                            : h("span", { class: "badge b-inactive" }, L.statusInactive),
                        xi.nyitottak.length ? h("span", { class: "badge b-pending" }, L.pending) : null));
            }));

        // Folyamatban lévő fizetések a kiválasztott hirdetésnél
        const nyitottBlokkok = info.nyitottak.map((f) => h("div", { class: "open-box" },
            h("div", { class: "t" }, L.openTitle),
            h("div", { class: "m" }, L.openText(describePurchase(f.vasarlasTipus, f.csomagKod, f.kiemelesKod), money(f.hatralevo > 0 ? f.hatralevo : f.osszeg))),
            h("button", { class: "btn secondary", type: "button", onclick: () => openBank(f, kivalasztott) }, L.openShow)));

        // Mód: csomag / csak kiemelés
        const lehetoseg = [];
        if (info.csomagElerheto) lehetoseg.push("csomag");
        if (info.kiemelesElerheto) lehetoseg.push("kiemeles");
        const modok = lehetoseg.length > 1
            ? h("div", { class: "modes", role: "tablist" }, lehetoseg.map((m) => h("button", {
                class: "mode" + (S.mode === m ? " sel" : ""), type: "button", role: "tab", "aria-selected": S.mode === m ? "true" : "false",
                onclick: () => { S.mode = m; if (m === "kiemeles" && !S.hl) S.hl = (d.arak.kiemelesek[0] || {}).kod || ""; setMsg(null); render(); }
            }, m === "csomag" ? L.modePack : L.modeHl)))
            : null;

        let vasarlasResz;
        if (lehetoseg.length === 0) {
            vasarlasResz = h("div", { class: "note" }, info.nyitottak.length ? L.allOpen : L.hlNeedsActive);
        } else {
            const csomagGrid = h("div", { class: "grid4" }, d.arak.csomagok.map((c) => h("button", {
                class: "pkg" + (S.pack === c.kod ? " sel" : ""), type: "button", "aria-pressed": S.pack === c.kod ? "true" : "false",
                onclick: () => { S.pack = c.kod; setMsg(null); render(); }
            }, h("div", { class: "n" }, packName(c.kod)), h("div", { class: "d" }, durationText(c.nap)), h("div", { class: "pr" }, money(c.ar)))));
            const hlOpciok = [];
            if (S.mode === "csomag") {
                hlOpciok.push(h("button", {
                    class: "pkg" + (S.hl === "" ? " sel" : ""), type: "button", "aria-pressed": S.hl === "" ? "true" : "false",
                    onclick: () => { S.hl = ""; setMsg(null); render(); }
                }, h("div", { class: "n" }, L.none), h("div", { class: "d" }, " "), h("div", { class: "pr" }, money(0))));
            }
            d.arak.kiemelesek.forEach((k) => hlOpciok.push(h("button", {
                class: "pkg" + (S.hl === k.kod ? " sel" : ""), type: "button", "aria-pressed": S.hl === k.kod ? "true" : "false",
                onclick: () => { S.hl = k.kod; setMsg(null); render(); }
            }, h("div", { class: "n" }, durationText(k.nap)), h("div", { class: "d" }, " "), h("div", { class: "pr" }, money(k.ar)))));
            vasarlasResz = h("div", null,
                S.mode === "csomag" ? [h("div", { class: "step" }, L.step2), csomagGrid] : null,
                h("div", { class: "step" }, S.mode === "csomag" ? L.step3 : L.step2hl),
                h("div", { class: "grid4" }, hlOpciok));
        }

        // Összegzés
        const csomag = lehetoseg.length > 0 && S.mode === "csomag" ? ar(d.arak.csomagok, S.pack) : null;
        const kiemeles = lehetoseg.length > 0 && S.hl ? ar(d.arak.kiemelesek, S.hl) : null;
        const lehetVenni = lehetoseg.length > 0 && hianyzik.length === 0 && (S.mode === "csomag" ? !!csomag : !!kiemeles);
        const osszeg = (csomag ? csomag.ar : 0) + (kiemeles ? kiemeles.ar : 0);
        const sorok = [h("div", { class: "sum-row" }, h("span", { class: "sum-ad" }, [kivalasztott.pozicio || "—", kivalasztott.helyszin ? ` – ${kivalasztott.helyszin}` : ""].join("")))];
        if (csomag) sorok.push(h("div", { class: "sum-row" }, h("span", null, L.packageLine(packName(csomag.kod), durationText(csomag.nap))), h("span", null, money(csomag.ar))));
        if (kiemeles) sorok.push(h("div", { class: "sum-row" }, h("span", null, L.highlightLine(durationText(kiemeles.nap))), h("span", null, money(kiemeles.ar))));
        const jegyzetek = [];
        if (csomag && info.hatralevoNap > 0) jegyzetek.push(h("div", { class: "note" }, L.extendNote(info.hatralevoNap)));
        if (csomag && kiemeles && kiemeles.nap > csomag.nap + info.hatralevoNap) jegyzetek.push(h("div", { class: "note" }, L.hlCapNote));

        const osszegzes = h("div", { class: "sum" },
            h("h3", null, L.summary), sorok,
            h("div", { class: "tot" }, h("span", null, L.total), h("span", null, money(osszeg))),
            jegyzetek,
            msgBox(),
            h("button", { class: "btn", type: "button", disabled: !lehetVenni || S.busy, onclick: requestPayment }, S.busy ? L.reqBusy : L.reqBtn),
            h("p", { class: "fine" }, L.fine));

        return h("div", null,
            topline(L.shopTitle, L.shopSub),
            flowStrip(),
            hianyzik.length ? h("div", { class: "warn-box" }, h("b", null, L.missingTitle), h("br"),
                L.missingText(hianyzik.map((k) => L.fields[k] || k).join(", "))) : null,
            h("div", { class: "layout" },
                h("div", null,
                    h("div", { class: "step first" }, L.step1), hirdetesLista,
                    nyitottBlokkok, modok, vasarlasResz),
                h("aside", { class: "side" }, osszegzes, trustLines())));
    }

    function emptyBox(cim, szoveg) {
        return h("div", { class: "empty-box" }, h("b", null, cim), szoveg);
    }

    // ── Hirdetéseim fül ──
    function tabAds() {
        const L = t();
        const d = S.data;
        const now = Date.now();
        const tartalom = d.hirdetesek.length === 0
            ? emptyBox(L.noAdsTitle, L.noAdsText)
            : h("div", { class: "card" }, d.hirdetesek.map((x) => {
                const info = adInfo(x);
                const allapot = adState(x, now);
                const nyitott = info.nyitottak[0] || null;
                const hasIdeje = x.lejaratMs > now;

                const elso = [];
                if (allapot === "active" || allapot === "paused") {
                    elso.push(L.adExpires(dateText(x.lejaratMs)));
                    if (allapot === "active" && x.kiemelesLejaratMs > now) elso.push(L.adHlUntil(dateText(x.kiemelesLejaratMs)));
                } else if (allapot === "expired") {
                    elso.push(L.adExpiredOn(dateText(x.lejaratMs)));
                } else if (!nyitott) {
                    elso.push(L.adNeverPaid);
                }

                const gombok = [];
                if (info.csomagElerheto) {
                    gombok.push(h("button", {
                        class: "mbtn" + (hasIdeje ? "" : " primary"), type: "button", onclick: () => goBuy(x, "csomag")
                    }, hasIdeje ? L.btnExtend : L.btnBuyPack));
                }
                if (allapot === "active" && info.kiemelesElerheto) {
                    gombok.push(h("button", { class: "mbtn", type: "button", onclick: () => goBuy(x, "kiemeles") }, L.btnHighlight));
                }
                if (nyitott) {
                    gombok.push(h("button", { class: "mbtn", type: "button", onclick: () => openBank(nyitott, x) }, L.btnTransfer));
                }

                return h("div", { class: "lrow" },
                    h("div", { class: "lrow-main" },
                        h("div", { class: "lrow-v" }, adTitle(x)),
                        elso.length ? h("div", { class: "lrow-meta" }, elso.join(" · ")) : null,
                        nyitott ? h("div", { class: "lrow-meta" }, L.adTransfer(nyitott.kozlemeny, dateText(nyitott.lejarMs))) : null),
                    h("div", { class: "lrow-side" },
                        h("span", { class: "badge " + (allapot === "active" ? "b-active" : allapot === "paused" ? "b-expired" : "b-inactive") }, L.adStatus[allapot]),
                        nyitott ? h("span", { class: "badge b-pending" }, L.pending) : null,
                        gombok));
            }));
        return h("div", null, topline(L.adsTitle, L.adsSub), tartalom);
    }

    // ── Fizetések fül ──
    const PAY_BADGE = { varakozik: "b-pending", reszleges: "b-pending", sikeres: "b-active", lezarva: "b-expired", lejart: "b-expired" };

    function tabPay() {
        const L = t();
        const d = S.data;
        const now = Date.now();
        const lista = d.fizetesek || [];
        const tartalom = lista.length === 0
            ? emptyBox(L.payEmptyTitle, L.payEmptyText)
            : h("div", { class: "card" }, lista.map((p) => {
                // Ha a határidő már lejárt, de a rendszer még nem zárta le, a cégnek már lejártként mutatjuk.
                const statusz = p.statusz === "varakozik" && p.lejarMs > 0 && p.lejarMs <= now ? "lejart" : p.statusz;
                const nyitott = statusz === "varakozik" || statusz === "reszleges" ? findOpenPayment(p.kozlemeny) : null;
                const mit = describePurchase(p.vasarlasTipus, p.csomagKod, p.kiemelesKod);
                const cim = [p.pozicio ? adTitle(p) : L.deletedAd, mit].filter(Boolean).join(" · ");
                const metaReszek = [];
                if (p.letrehozvaMs > 0) metaReszek.push(dateText(p.letrehozvaMs));
                if (nyitott) metaReszek.push(L.payDeadline(dateText(nyitott.f.lejarMs)));
                return h("div", { class: "lrow" },
                    h("div", { class: "lrow-main" },
                        h("div", { class: "lrow-v" }, cim),
                        h("div", { class: "lrow-meta" }, h("span", { class: "mono" }, p.kozlemeny), metaReszek.length ? ` · ${metaReszek.join(" · ")}` : ""),
                        statusz === "reszleges" && p.befizetve > 0 ? h("div", { class: "lrow-meta" }, `${L.alreadyPaid}: ${money(p.befizetve)}`) : null),
                    h("div", { class: "lrow-side" },
                        h("span", { class: "amt" }, money(p.osszeg)),
                        h("span", { class: "badge " + (PAY_BADGE[statusz] || "b-expired") }, L.payStatus[statusz] || statusz),
                        nyitott ? h("button", { class: "mbtn", type: "button", onclick: () => openBank(nyitott.f, nyitott.hirdetes) }, L.btnTransfer) : null));
            }));
        return h("div", null, topline(L.payTitle, L.paySub), tartalom,
            lista.length ? h("div", { class: "info-note" }, h("span", { "aria-hidden": "true" }, "ⓘ"), h("span", null, L.payNote)) : null);
    }

    // ── Cégadatok fül (csak megjelenítés; a módosítás az appban történik) ──
    function tabCo() {
        const L = t();
        const d = S.data;
        const c = d.cegAdatok || {};
        const hianyzik = d.hianyzoAdatok || [];
        const hiany = (...kulcsok) => kulcsok.some((k) => hianyzik.includes(k));
        const mezo = (cimke, ertek, hianyzo) => h("div", { class: "frow" },
            h("div", { class: "fk" }, cimke),
            hianyzo ? h("div", { class: "fv miss" }, L.coMissing) : h("div", { class: "fv" }, ertek || "—"));
        const szamlazasiCim = [[c.iranyitoszam, c.varos].filter(Boolean).join(" "), c.cim].filter(Boolean).join(", ");
        const email = (S.user && S.user.email) || "";
        const mezok = [
            mezo(L.coName, c.cegNev, hiany("companyName")),
            mezo(L.coTax, c.adoszam, hiany("taxId")),
            c.kozossegiAdoszam ? mezo(L.coEuTax, c.kozossegiAdoszam, false) : null,
            mezo(L.coAddress, szamlazasiCim, hiany("szamlazasiIranyitoszam", "szamlazasiVaros", "szamlazasiCim")),
            mezo(L.coCountry, c.orszag, false),
            mezo(L.coEmail, c.kapcsolatiEmail, hiany("contactEmail")),
            mezo(L.coLogin, email, false)
        ];
        return h("div", null,
            topline(L.coTitle, L.coSub),
            hianyzik.length ? h("div", { class: "warn-box" }, h("b", null, L.missingTitle), h("br"),
                L.missingText(hianyzik.map((k) => L.fields[k] || k).join(", "))) : null,
            h("div", { class: "card" },
                h("div", { class: "hero" },
                    avatar("big-av"),
                    h("div", { class: "hero-main" },
                        h("div", { class: "hero-name" }, c.cegNev || "—"),
                        c.kapcsolatiEmail ? h("div", { class: "lrow-meta" }, L.coContact(c.kapcsolatiEmail)) : null),
                    hianyzik.length === 0
                        ? h("div", { class: "ok-line" }, L.coAllOk)
                        : h("div", { class: "miss-line" }, L.coSomeMissing(hianyzik.length))),
                h("div", { class: "fgrid" }, mezok)),
            h("div", { class: "info-note" }, h("span", { "aria-hidden": "true" }, "ⓘ"), h("span", null, L.coNote)));
    }

    function kv(kulcs, ertek, opts = {}) {
        const masol = opts.masol;
        const gomb = masol ? h("button", { class: "copy", type: "button" }, t().copy) : null;
        if (gomb) {
            gomb.addEventListener("click", async () => {
                let ok = false;
                try { await navigator.clipboard.writeText(ertek); ok = true; } catch (e) {
                    try {
                        const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = ertek;
                        document.body.append(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
                    } catch (e2) { ok = false; }
                }
                if (ok) { gomb.textContent = t().copied; gomb.classList.add("done"); setTimeout(() => { gomb.textContent = t().copy; gomb.classList.remove("done"); }, 1800); }
            });
        }
        return h("div", { class: "kv-row" },
            h("span", { class: "kv-k" }, kulcs),
            h("span", { class: "kv-v" + (opts.nagy ? " big" : "") }, ertek, gomb));
    }

    function viewBank() {
        const L = t();
        const b = S.bank;
        const fizetendo = b.hatralevo > 0 ? b.hatralevo : b.osszeg;
        const sorok = b.befizetve > 0
            ? [kv(L.alreadyPaid, money(b.befizetve)), kv(L.remaining, money(fizetendo), { nagy: true })]
            : [kv(L.amount, money(fizetendo), { nagy: true })];
        sorok.push(
            kv(L.beneficiary, "Infinity Gold Kft."),
            kv(L.bankName, b.bankNev),
            kv(L.account, b.bankszamlaszam, { masol: true }),
            kv(L.reference, b.kozlemeny, { masol: true }),
            kv(L.deadline, dateText(b.lejarMs)));
        return h("div", { class: "bank-wrap" },
            h("span", { class: "status-pill" }, L.waiting(daysUntil(b.lejarMs))),
            h("h1", null, L.bankTitle),
            h("p", { class: "sub" }, [b.hirdetesCim, describePurchase(b.vasarlasTipus, b.csomagKod, b.kiemelesKod)].filter(Boolean).join(" · ")),
            h("div", { class: "kv" }, sorok),
            h("p", { class: "note" }, L.refMust),
            h("p", { class: "note" }, L.afterPay),
            h("button", { class: "btn", type: "button", onclick: () => goTab(b.from || "buy") },
                b.from === "ads" ? L.backAdsTab : b.from === "pay" ? L.backPayTab : L.backToAds));
    }

    function openBank(f, hirdetes) {
        S.bank = {
            hirdetesCim: [hirdetes.pozicio, hirdetes.helyszin].filter(Boolean).join(" – "),
            vasarlasTipus: f.vasarlasTipus, csomagKod: f.csomagKod, kiemelesKod: f.kiemelesKod,
            osszeg: f.osszeg, befizetve: f.befizetve || 0, hatralevo: f.hatralevo,
            bankNev: f.bankNev, bankszamlaszam: f.bankszamlaszam, kozlemeny: f.kozlemeny, lejarMs: f.lejarMs,
            from: S.tab
        };
        show("bank");
    }

    // ───────────────────────── Műveletek ─────────────────────────
    async function requestPayment() {
        const hirdetes = ad();
        if (!hirdetes || S.busy) return;
        const csomagKod = S.mode === "csomag" ? S.pack : null;
        const kiemelesKod = S.hl || null;
        S.busy = true; setMsg(null); render();
        try {
            const r = await call("createAtutalasosFizetes", { hirdetesId: hirdetes.id, csomagKod, kiemelesKod });
            S.bank = {
                hirdetesCim: [hirdetes.pozicio, hirdetes.helyszin].filter(Boolean).join(" – "),
                vasarlasTipus: csomagKod ? "alapcsomag" : "kiemeles", csomagKod, kiemelesKod,
                osszeg: r.osszeg, befizetve: 0, hatralevo: r.osszeg,
                bankNev: r.bankNev, bankszamlaszam: r.bankszamlaszam, kozlemeny: r.kozlemeny, lejarMs: r.lejar || Date.now() + 10 * DAY,
                from: "buy"
            };
            S.busy = false;
            show("bank");
            refreshQuietly();
        } catch (e) {
            S.busy = false;
            setMsg("hiba", payError(e));
            render();
            const m = (e && e.message) || "";
            if (m === "PAYMENT_ALREADY_OPEN" || m === "HIGHLIGHT_NEEDS_ACTIVE_AD") refreshQuietly(true);
        }
    }

    /** A lista újratöltése a háttérben (a nézet marad). */
    async function refreshQuietly(rajzol) {
        try {
            S.data = await call("listazCegHirdeteseit");
            ensureSelection();
            if (rajzol || S.view === "account") render(); else renderNav();
        } catch (e) { /* a következő megnyitáskor úgyis újratölt */ }
    }

    async function loadData() {
        show("loading");
        try {
            S.data = await call("listazCegHirdeteseit");
            if (S.data.munkavallalo) { show("worker"); return; }
            ensureSelection();
            show("account");
        } catch (e) {
            if (e && e.code === "functions/unauthenticated") { await signOut(auth); return; }
            show("error");
        }
    }

    // ───────────────────────── Indítás ─────────────────────────
    document.querySelectorAll(".lang-btn").forEach((b) => b.addEventListener("click", () => {
        S.lang = b.dataset.lang;
        try { localStorage.setItem("vjob_lang", S.lang); } catch (e) { /* nem baj */ }
        render();
    }));
    async function logout() {
        try { await signOut(auth); } catch (e) { /* az onAuthStateChanged úgyis kezeli */ }
    }
    $("logout-btn").addEventListener("click", logout);

    onAuthStateChanged(auth, (user) => {
        S.user = user;
        S.busy = false;
        if (!user) {
            S.data = null; S.adId = null; S.bank = null; S.tab = "buy"; setMsg(null);
            show("login");
            return;
        }
        loadData();
    });

    render();
</script>

</body>
</html>
